<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Lite</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', serif;
    color: #c8a96e;
    padding: 40px 24px;
  }
  h1 {
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(200,169,110,.4);
    margin-bottom: 40px;
  }

  /* DM / Player toggle */
  #role-picker {
    display: flex;
    gap: 16px;
    margin-bottom: 40px;
  }
  .role-btn {
    padding: 12px 40px;
    background: rgba(200,169,110,.06);
    border: 1px solid rgba(200,169,110,.2);
    border-radius: 4px;
    color: rgba(200,169,110,.55);
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Georgia', serif;
    transition: all .2s;
  }
  .role-btn:hover, .role-btn.active {
    background: rgba(200,169,110,.18);
    border-color: rgba(200,169,110,.5);
    color: #ffe9a0;
  }

  .section { display: none; }
  .section.visible { display: flex; }

  /* ── Two-column player layout ── */
  #player-section {
    gap: 48px;
    align-items: flex-start;
  }

  /* LEFT: cards + name */
  .col-left {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 440px;
  }

  /* Class cards — stacked vertically, full width */
  .cc-role-card {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 20px;
    padding: 20px 24px;
    background: rgba(200,169,110,.04);
    border: 1px solid rgba(200,169,110,.15);
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
    width: 100%;
  }
  .cc-role-card:hover {
    background: rgba(200,169,110,.09);
    border-color: rgba(200,169,110,.35);
  }
  .cc-role-card.selected {
    background: rgba(200,169,110,.12);
    border-color: rgba(200,169,110,.6);
  }

  /* Left part of card: icon + name + desc */
  .cc-role-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 140px;
    flex-shrink: 0;
  }
  .cc-role-icon {
    font-size: 28px;
    filter: grayscale(1);
    transition: filter .2s;
    line-height: 1;
  }
  .cc-role-card.selected .cc-role-icon { filter: grayscale(0); }
  .cc-role-name {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c8a96e;
  }
  .cc-role-desc {
    font-size: 10px;
    color: rgba(200,169,110,.4);
    line-height: 1.6;
    letter-spacing: .3px;
  }

  /* Right part of card: stat bars */
  .cc-card-stats {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 7px;
    border-left: 1px solid rgba(200,169,110,.1);
    padding-left: 20px;
  }
  .cc-card-stat { display: flex; align-items: center; gap: 8px; }
  .cc-card-stat-name {
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(200,169,110,.4);
    width: 26px;
    text-align: right;
    flex-shrink: 0;
  }
  .cc-card-stat-bar {
    flex: 1;
    height: 3px;
    background: rgba(200,169,110,.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .cc-card-stat-fill {
    height: 100%;
    border-radius: 2px;
    transition: width .4s ease;
  }
  .cc-card-stat-fill.stat-fill { background: linear-gradient(to right, #c8a96e, #ffe9a0); }
  .cc-card-stat-fill.hp-fill   { background: linear-gradient(to right, #c45050, #e85d5d); }
  .cc-card-stat-val {
    font-size: 10px;
    color: rgba(200,169,110,.6);
    width: 18px;
    text-align: right;
    flex-shrink: 0;
  }
  .cc-card-stat-val.hp-val { color: #e85d5d; }

  /* Name field under cards */
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(200,169,110,.4);
  }
  input {
    background: rgba(200,169,110,.06);
    border: 1px solid rgba(200,169,110,.25);
    border-radius: 4px;
    padding: 10px 14px;
    color: #ffe9a0;
    font-size: 16px;
    letter-spacing: 2px;
    font-family: 'Georgia', serif;
    width: 100%;
  }
  input:focus { outline: none; border-color: rgba(200,169,110,.6); }
  input::placeholder { color: rgba(200,169,110,.2); letter-spacing: 2px; }

  /* RIGHT: session panel */
  .col-right {
    display: flex;
    flex-direction: column;
    width: 240px;
    padding-top: 4px;
  }
  #code-input {
    font-size: 28px;
    letter-spacing: 10px;
    text-align: center;
    text-transform: uppercase;
    font-family: monospace;
    margin-bottom: 4px;
  }
  #code-input::placeholder { font-size: 14px; letter-spacing: 4px; }
  button {
    display: block;
    width: 100%;
    padding: 12px;
    background: rgba(200,169,110,.08);
    border: 1px solid rgba(200,169,110,.3);
    border-radius: 4px;
    color: #c8a96e;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Georgia', serif;
    transition: all .2s;
    text-align: center;
    margin-top: 8px;
  }
  button:hover { background: rgba(200,169,110,.18); color: #ffe9a0; }
  button:disabled { opacity: .35; cursor: default; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 8px;
  }
  .divider hr { flex: 1; border: none; border-top: 1px solid rgba(200,169,110,.12); }
  .divider span { font-size: 10px; letter-spacing: 3px; color: rgba(200,169,110,.25); text-transform: uppercase; }
  #btn-solo {
    background: transparent;
    border-color: rgba(200,169,110,.15);
    color: rgba(200,169,110,.4);
  }
  #btn-solo:hover { background: rgba(200,169,110,.08); color: rgba(200,169,110,.8); border-color: rgba(200,169,110,.3); }
  #status {
    margin-top: 16px;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(200,169,110,.35);
    text-transform: uppercase;
    min-height: 16px;
    text-align: center;
  }
  .session-note {
    margin-top: 12px;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(200,169,110,.2);
    text-align: center;
    line-height: 1.6;
  }

  /* DM section */
  #dm-section {
    flex-direction: column;
    align-items: center;
  }
  #dm-section a {
    display: block;
    width: 260px;
    padding: 14px;
    background: rgba(200,169,110,.08);
    border: 1px solid rgba(200,169,110,.3);
    border-radius: 4px;
    color: #c8a96e;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    text-decoration: none;
    transition: all .2s;
  }
  #dm-section a:hover { background: rgba(200,169,110,.18); color: #ffe9a0; }
  .dm-note {
    margin-top: 16px;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(200,169,110,.3);
    text-transform: uppercase;
  }
</style>
</head>
<body>


<h1>D&D Lite</h1>

<div id="role-picker">
  <button class="role-btn" id="btn-dm">DM</button>
  <button class="role-btn active" id="btn-player">Player</button>
</div>

<div id="player-section" class="section visible">

  <!-- Left: name -->
  <div class="col-left">

    <div class="field">
      <label>Name</label>
      <input id="name-input" type="text" placeholder="Your name" maxlength="24" autocomplete="off">
    </div>
  </div>

  <!-- Right: session -->
  <div class="col-right">
    <div class="field">
      <label>Session Code</label>
      <input id="code-input" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false">
    </div>
    <button id="btn-join" disabled>Join Session</button>
    <div class="divider"><hr><span>or</span><hr></div>
    <button id="btn-solo">Play Solo</button>
    <div id="status"></div>
    <p class="session-note">Pick your class &amp; color after joining.</p>
  </div>

</div>

<div id="dm-section" class="section">
  <a href="scenes/dm/session.html">Open DM Lobby →</a>
  <p class="dm-note">Create a session · share the code with players</p>
</div>

<script type="module">
import { connect, send, on } from './scripts/game-socket.js';

// DM / Player toggle
document.getElementById('btn-dm').addEventListener('click', () => {
  document.getElementById('btn-dm').classList.add('active');
  document.getElementById('btn-player').classList.remove('active');
  document.getElementById('player-section').classList.remove('visible');
  document.getElementById('dm-section').classList.add('visible');
});

document.getElementById('btn-player').addEventListener('click', () => {
  document.getElementById('btn-player').classList.add('active');
  document.getElementById('btn-dm').classList.remove('active');
  document.getElementById('dm-section').classList.remove('visible');
  document.getElementById('player-section').classList.add('visible');
  statusEl.textContent = '';
});

const nameInput = document.getElementById('name-input');
const codeInput = document.getElementById('code-input');
const btnJoin   = document.getElementById('btn-join');
const statusEl  = document.getElementById('status');

// Pre-fill name from a saved character
const existing = JSON.parse(localStorage.getItem('dndlite-character') || 'null');
if (existing) nameInput.value = existing.name || '';

function updateJoinBtn() {
  btnJoin.disabled = nameInput.value.trim().length === 0 || codeInput.value.length !== 4;
}
nameInput.addEventListener('input', updateJoinBtn);
codeInput.addEventListener('input', () => {
  codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  updateJoinBtn();
});

let connected = false;
connect(() => { connected = true; statusEl.textContent = 'Connected'; });

on('joined', (msg) => {
  localStorage.setItem('dndlite-character', JSON.stringify({ name: nameInput.value.trim(), role: msg.role, color: msg.color }));
  localStorage.setItem('player-id', msg.playerId);
  localStorage.setItem('session-code', codeInput.value);
  localStorage.setItem('unlocked-stages', JSON.stringify(msg.unlockedStages));
  localStorage.setItem('dndlite-solo', '');
  statusEl.textContent = 'Joined! Choose your hero…';
  setTimeout(() => { window.location.href = 'scenes/character-select.html'; }, 400);
});

on('solo_started', (msg) => {
  localStorage.setItem('dndlite-character', JSON.stringify({ name: nameInput.value.trim(), role: msg.role, color: msg.color }));
  localStorage.setItem('player-id', msg.playerId);
  localStorage.setItem('session-code', msg.code);
  localStorage.setItem('unlocked-stages', JSON.stringify(msg.unlockedStages));
  localStorage.setItem('dndlite-solo', '1');
  window.location.href = 'scenes/character-select.html';
});

on('error', (msg) => { statusEl.textContent = msg.message; updateJoinBtn(); });
on('_disconnect', () => { connected = false; statusEl.textContent = 'Server not reachable'; });

btnJoin.addEventListener('click', () => {
  if (!connected || !nameInput.value.trim()) return;
  btnJoin.disabled = true;
  statusEl.textContent = 'Joining…';
  send({ type: 'player_join', code: codeInput.value, name: nameInput.value.trim() });
});

document.getElementById('btn-solo').addEventListener('click', () => {
  if (!nameInput.value.trim()) { statusEl.textContent = 'Enter your name first'; return; }
  if (!connected) { statusEl.textContent = 'Connecting to server...'; return; }
  send({ type: 'start_solo', name: nameInput.value.trim() });
});
</script>
</body>
</html>
