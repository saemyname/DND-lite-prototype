<!DOCTYPE html>
<html lang="en">
<head>

<title>D&D Lite — Stage 05</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.176.0/"

}

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Georgia', serif;
    color: #c8a96e;
    user-select: none;
  }
  body.spectator #hud-stats,
  body.spectator #nav,
  body.spectator #title,
  body.spectator #event-panel,
  body.spectator #d20-hud,
  body.spectator #status-msg,
  body.spectator #chat-panel,
  body.spectator #victory,
  body.spectator #game-over { display: none !important; }
  body.not-my-turn { cursor: not-allowed; }
  canvas { display: block; width: 100%; height: 100%; }

  #title {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    font-size: 14px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(200,169,110,.5);
    pointer-events: none;
  }

  #nav {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 50;
    display: flex;
    gap: 8px;
  }
  #nav a {
    padding: 6px 14px;
    background: rgba(200,169,110,.06);
    border: 1px solid rgba(200,169,110,.2);
    border-radius: 4px;
    color: rgba(200,169,110,.55);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all .2s;
  }
  #nav a:hover {
    background: rgba(200,169,110,.18);
    border-color: rgba(200,169,110,.5);
    color: #ffe9a0;
  }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(200,169,110,.5);
    transition: opacity .6s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }

  /* Enemy HP labels */
  .enemy-hp {
    position: fixed;
    pointer-events: none;
    z-index: 30;
    font-family: 'Georgia', serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: #e85d5d;
    background: rgba(0,0,0,.65);
    border: 1px solid rgba(232,93,93,.4);
    border-radius: 3px;
    padding: 2px 8px;
    transform: translate(-50%, -100%);
    white-space: nowrap;
  }

  /* Player name labels */
  .player-name-label {
    position: fixed;
    pointer-events: none;
    z-index: 30;
    font-family: 'Georgia', serif;
    font-size: 11px;
    letter-spacing: 1px;
    color: #88c8ff;
    background: rgba(0,0,0,.6);
    border: 1px solid rgba(136,200,255,.4);
    border-radius: 3px;
    padding: 2px 8px;
    transform: translate(-50%, -100%);
    white-space: nowrap;
  }
  .player-name-label.me { color: #ffe9a0; border-color: rgba(255,233,160,.5); }
  .player-name-label.active-turn {
    color: #fff;
    background: rgba(255,233,160,.22);
    border-color: #ffe97a;
    font-weight: bold;
    animation: turn-pulse 1.1s ease-in-out infinite;
  }
  @keyframes turn-pulse {
    0%, 100% { box-shadow: 0 0 7px rgba(255,233,160,.55); }
    50%      { box-shadow: 0 0 18px rgba(255,233,160,1); }
  }

  /* Status message */
  #status-msg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 60;
    font-family: 'Georgia', serif;
    font-size: 17px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #e85d5d;
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
  }

  /* HUD stats */
  #hud-stats {
    position: fixed;
    bottom: 28px;
    left: 28px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: rgba(0,0,0,.45);
    border: 1px solid rgba(200,169,110,.12);
    border-radius: 6px;
    padding: 12px 16px;
    backdrop-filter: blur(4px);
    font-family: 'Georgia', serif;
  }
  #hud-name { font-size: 20px; letter-spacing: 2px; color: #ffe9a0; line-height: 1.2; }
  #hud-role { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #c8a96e; opacity: .5; margin-bottom: 4px; }
  .hud-stat { display: flex; align-items: center; gap: 10px; }
  .hud-stat-name { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #c8a96e; opacity: .5; width: 32px; }
  .hud-stat-bar { width: 80px; height: 4px; background: rgba(200,169,110,.12); border-radius: 2px; overflow: hidden; }
  .hud-stat-fill { height: 100%; border-radius: 2px; background: linear-gradient(to right, #c8a96e, #ffe9a0); }
  .hud-stat-fill.hp-fill { background: linear-gradient(to right, #c45050, #e85d5d); }
  .hud-stat-val { font-size: 14px; color: #c8a96e; opacity: .75; width: 22px; text-align: right; }
  .hud-stat-val.hp-val { color: #e85d5d; }

  /* Event panel */
  #event-panel {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 50;
    width: 620px;
    max-width: calc(100vw - 340px);
    background: rgba(0,0,0,.65);
    border: 1px solid rgba(200,169,110,.2);

  #event-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  #event-result { font-size: 21px; letter-spacing: 1px; color: #ffe9a0; }
  #event-result.success { color: #66bb6a; }
  #event-result.fail { color: #e85d5d; }
  #event-outcome { font-size: 18px; line-height: 1.6; color: rgba(200,169,110,.7); }

  .event-btn:disabled { opacity: .3; pointer-events: none; }

  /* D20 dice */
  #d20-hud {
    position: fixed;
    bottom: 20px;
    right: 28px;
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;

    transition: transform .4s;

  #d20-hud.active { pointer-events: all; cursor: pointer; transform: scale(1.5) translateY(-16px); }
  #d20-hud.active:hover #d20-dice-shape { filter: brightness(1.4) drop-shadow(0 0 8px rgba(200,169,110,.5)); }
  #d20-dice-shape { width: 100px; height: 100px; transition: filter .2s; }
  #d20-dice-shape polygon { fill: rgba(30,22,12,.85); stroke: rgba(200,169,110,.85); stroke-width: 1.4; }
  #d20-dice-shape line { stroke: rgba(200,169,110,.85); stroke-width: 1.4; }
  #d20-dice-shape.success polygon { fill: rgba(102,187,106,.15); stroke: rgba(102,187,106,.8); }
  #d20-dice-shape.success line { stroke: rgba(102,187,106,.8); }
  #d20-dice-shape.fail polygon { fill: rgba(232,93,93,.15); stroke: rgba(232,93,93,.8); }
  #d20-dice-shape.fail line { stroke: rgba(232,93,93,.8); }
  @keyframes d20-roll {
    0%   { transform: rotate(0deg) scale(1); }
    25%  { transform: rotate(90deg) scale(1.1); }
    50%  { transform: rotate(180deg) scale(0.95); }
    75%  { transform: rotate(270deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }

  #d20-wrapper { position: relative; width: 100px; height: 100px; }
  #d20-value {

  #d20-label { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: rgba(200,169,110,.4); height: 14px; font-family: 'Georgia', serif; }


  /* Overlays */
  #victory, #game-over {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 800;
    background: rgba(0,0,0,.85);
    border: 1px solid rgba(255,233,160,.35);
    border-radius: 8px;
    padding: 30px 50px;
    box-shadow: 0 8px 40px rgba(0,0,0,.6);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-family: 'Georgia', serif;

  .overlay-title { font-size: 48px; letter-spacing: 6px; text-shadow: 0 0 40px currentColor; }
  .overlay-sub { font-size: 19px; letter-spacing: 2px; opacity: .5; }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';
import { send, on } from '../scripts/game-socket.js';
import { createEmojiMiniature, createSlimeMiniature, updateSlimeAnimation, fadeOutToken, triggerSlimeAttack, flashEnemyDamage, buildPlayerLabel, buildEnemyLabel, updatePlayerLabelHp } from '../scripts/miniature.js';
import { colorForKey, cssColorForKey } from '../scripts/colors.js';
import { placeLyraSlime, placeWell, placeGoblinBox } from '../scripts/voxel-village.js';
import { initDebugBots, debugActAs, isControlledBy, debugBotsAreActive } from '../scripts/debug-bots.js';
import { placeProp, KIT } from '../scripts/kit-props.js';
import { loadSkills, renderCombatActions, updatePoisonBadge } from '../scripts/combat-ui.js';
import { renderLevelUpPanel, updateLevelChip } from '../scripts/levelup-ui.js';
loadSkills();
import { playBGM, playSFX } from '../scripts/audio.js';
document.addEventListener('click', (e) => {
  if (e.target.closest && e.target.closest('.event-btn')) playSFX('ui_click');
}, true);
playBGM('boss');
import { loadBlockMaterials } from '../scripts/voxel-textures.js';

// ── Grid / combat state (module scope) ──
let gridData = null;
let floorPlane = null;
let playerToken = null;
let playerCol = 0, playerRow = 0;
let playerTargetPos = null;
let enemyTokens = [];
let turnState = 'idle'; // 'idle' | 'move' | 'moving' | 'action'
const highlightMeshes = [];
const highlightGroup = new THREE.Group();
const charData = JSON.parse(localStorage.getItem('dndlite-character') || 'null');
const myPid = localStorage.getItem('player-id');
let serverState = null;
let lastPendingKey = null;
initDebugBots({ myPid, getServerState: () => serverState });
const playerTokens = new Map();   // pid → { group, label, role }
const loadingPids = new Set();    // pids whose token is mid-load (race guard)
const blockMats = loadBlockMaterials('../Assets/Tiles/');

function initHUD() {
  if (!charData) return;
  const nameEl = document.getElementById('hud-name');
  const roleEl = document.getElementById('hud-role');
  if (nameEl) nameEl.textContent = charData.name;
  if (roleEl) roleEl.textContent = charData.role;
  updateHUD();
}

function updateHUD() {
  if (!charData) return;
  ['str','agi','int','lck','hp'].forEach(key => {
    const val = charData[key] ?? 0;
    const el = document.getElementById('val-' + key);
    const bar = document.getElementById('bar-' + key);
    if (el) el.textContent = val;
    if (bar) bar.style.width = (val / 20 * 100) + '%';
  });

  // Mirror server-side HP if available
  if (serverState) {
    const me = serverState.players.find(p => p.pid === myPid);
    if (me) {
      const hpEl  = document.getElementById('val-hp');
      const hpBar = document.getElementById('bar-hp');
      if (hpEl)  hpEl.textContent  = me.hp;
      if (hpBar) hpBar.style.width = (me.hp / me.maxHp * 100) + '%';
    }
  }
}

// ── Renderer ──
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
scene.add(highlightGroup);
scene.background = new THREE.Color(0x050210);

// ── Camera ──
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
const BASE_CAM_POS = new THREE.Vector3(0, 34, 34);
const LOOK_TARGET  = new THREE.Vector3(0, 0, -24);

// ── Lighting ──
scene.add(new THREE.AmbientLight(0xfff0d0, 0.5));

const keyLight = new THREE.DirectionalLight(0xfff0d0, 1.5);
keyLight.position.set(8, 20, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -30;
keyLight.shadow.camera.right = 30;
keyLight.shadow.camera.top = 30;
keyLight.shadow.camera.bottom = -30;
keyLight.shadow.camera.far = 60;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8899ff, 0.4);
fillLight.position.set(-10, 8, -6);
scene.add(fillLight);

const overheadLight = new THREE.PointLight(0xffa552, 3, 50, 1.5);
overheadLight.position.set(0, 12, -8);
scene.add(overheadLight);

// ── GLB loader ──
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

// ── Model loading ──
let currentModel = null;

function placeModel(gltfScene, name) {
  if (currentModel) {
    scene.remove(currentModel);
    currentModel.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
    currentModel = null;
  }

  const model = gltfScene;
  model.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  model.position.sub(center);

  const baseScale = 40 / Math.max(size.x, 0.01);
  const scaledDepth = size.z * baseScale;
  const camZ = BASE_CAM_POS.z;
  const perspComp = (camZ + scaledDepth / 2) / camZ;
  const scale = baseScale * perspComp;
  model.scale.setScalar(scale);

  const group = new THREE.Group();
  group.add(model);
  const finalDepth = size.z * scale;
  group.position.set(0, 0, -finalDepth / 2);

  scene.add(group);
  currentModel = group;

  // Rotate around the model's world center
  LOOK_TARGET.set(0, 0, -finalDepth / 2);
  camera.position.copy(BASE_CAM_POS);
  camera.lookAt(LOOK_TARGET);
  camera.updateProjectionMatrix();

  document.getElementById('loading').classList.add('hidden');
}

// ── Grid utilities ──
function gridToWorld(col, row) {
  const { cellSizeX, cellSizeZ, originX, originZ, floorY } = gridData.grid;
  return new THREE.Vector3(
    originX + col * cellSizeX + cellSizeX / 2,
    floorY,
    originZ + row * cellSizeZ + cellSizeZ / 2
  );
}

function isWalkable(col, row) {
  const { cols, rows } = gridData.grid;
  if (col < 0 || col >= cols || row < 0 || row >= rows) return false;
  return gridData.walkable[row][col] === 1;
}

function calcMoveRange(startCol, startRow, range) {
  const tiles = [];
  const visited = new Set();
  const queue = [{ col: startCol, row: startRow, dist: 0 }];
  visited.add(`${startCol},${startRow}`);
  const blockedTiles = new Set(
    enemyTokens.filter(e => e.hp > 0).map(e => `${e.col},${e.row}`)
  );
  if (serverState) {
    for (const p of serverState.players) {
      if (p.col !== startCol || p.row !== startRow) blockedTiles.add(`${p.col},${p.row}`);
    }
  }
  while (queue.length) {
    const { col, row, dist } = queue.shift();
    tiles.push({ col, row });
    if (dist < range) {
      for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nc = col + dc, nr = row + dr;
        const key = `${nc},${nr}`;
        if (!visited.has(key) && isWalkable(nc, nr) && !blockedTiles.has(key)) {
          visited.add(key);
          queue.push({ col: nc, row: nr, dist: dist + 1 });
        }
      }
    }
  }
  return tiles;
}

// ── Player token ──
const MOVE_RANGE_BY_ROLE   = { warrior: 3, rogue: 5, mage: 4, cleric: 4 };
const ATTACK_RANGE_BY_ROLE = { warrior: 1, rogue: 2, mage: 2, cleric: 1 };
function inAtkRange(c1, r1, c2, r2, range) {
  const dc = Math.abs(c1 - c2), dr = Math.abs(r1 - r2);
  if (range <= 1) return Math.max(dc, dr) <= 1;
  return dc + dr <= range;
}

function loadPlayerTokenForRole(roleName, colorKey) {
  const group = createSlimeMiniature(roleName, 4, colorForKey(colorKey));
  group.rotation.y = Math.PI;
  return Promise.resolve(group);
}

// ── Enemy tokens ──
function createEnemyToken(enemy) {
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.9 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.2, 0.7), bodyMat);
  body.position.y = 0.6;
  body.castShadow = true;
  group.add(body);
  const headMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), headMat);
  head.position.y = 1.45;
  head.castShadow = true;
  group.add(head);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
  [-0.14, 0.14].forEach(ex => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 6), eyeMat);
    eye.position.set(ex, 1.48, 0.28);
    group.add(eye);
  });
  group.userData.enemyId = enemy.id;
  group.scale.setScalar(3);
  return group;
}

function placeEnemies() {
  gridData.enemies.forEach(e => {
    const mesh = createEnemyToken(e);
    const pos = gridToWorld(e.col, e.row);
    mesh.position.set(pos.x, gridData.grid.floorY, pos.z);
    scene.add(mesh);
    const { label, fillEl } = buildEnemyLabel(e.name || 'Enemy');
    document.body.appendChild(label);
    updatePlayerLabelHp(fillEl, e.hp, e.maxHp);
    enemyTokens.push({ ...e, mesh, label, fillEl });
  });
}

// Kenney-kit decoration helpers (shared shape with stage01).
const _seedRnd = (c, r) => {
  let s = (c * 73856093) ^ (r * 19349663);
  return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
};
function _kitCellProp(url, c, r, opts = {}) {
  const pos = gridToWorld(c, r);
  placeProp(scene, url, { x: pos.x + (opts.dx || 0), z: pos.z + (opts.dz || 0), y: gridData.grid.floorY, ...opts });
}
// Throne hall: carved columns, braziers flanking the dais, war banners.
function decorateThroneKit() {
  const g = gridData.grid;
  let i = 0;
  for (let r = 0; r < g.rows; r++) {
    for (let c = 0; c < g.cols; c++) {
      if (gridData.walkable[r][c] !== 0) continue;
      if (r === g.rows - 1 && (c === 0 || c === g.cols - 1)) continue;
      if ((gridData.challenges || []).some(ch => ch.col === c && ch.row === r)) continue;
      const rnd = _seedRnd(c, r);
      _kitCellProp(KIT.nature(i % 3 === 2 ? 'statue_columnDamaged' : 'statue_column'), c, r,
        { fitHeight: 5.5, rotY: Math.floor(rnd() * 4) * Math.PI / 2 });
      if (i % 4 === 1) _kitCellProp(KIT.town('banner-red'), c, r, { fitHeight: 3.8, dx: 2.3, rotY: Math.PI });
      i++;
    }
  }
  // braziers flanking the throne dais (throne sits near col 5.5, row 0.3)
  _kitCellProp(KIT.nature('campfire_bricks'), 4, 1, { fitHeight: 1.4 });
  _kitCellProp(KIT.nature('campfire_bricks'), 7, 1, { fitHeight: 1.4 });
}

function buildThroneScene() {
  const { cols, rows, cellSizeX, cellSizeZ, originX, originZ, floorY } = gridData.grid;
  const walkable = gridData.walkable;

  const block = (w, h, d, blockName) => new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    blockMats[`${blockName}_side`] || blockMats[`${blockName}_top`]
  );

  // Floor: alternating dark stone and gold for a regal look
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = originX + c * cellSizeX + cellSizeX / 2;
      const z = originZ + r * cellSizeZ + cellSizeZ / 2;
      const blockName = (r + c) % 2 === 0 ? 'dark' : 'gold';
      const tile = new THREE.Mesh(
        new THREE.BoxGeometry(cellSizeX, 0.4, cellSizeZ),
        blockMats[`${blockName}_top`]
      );
      tile.position.set(x, floorY - 0.2, z);
      tile.receiveShadow = true;
      scene.add(tile);

      const isFrontCorner = r === rows - 1 && (c === 0 || c === cols - 1);
      const isChallengeCell = (gridData.challenges || []).some(ch => ch.col === c && ch.row === r);
      // (kit columns replace the voxel pillars — see decorateThroneKit)
    }
  }

  // Perimeter walls — brick_grey for stone keep
  const wallH = 6;
  const wallT = 1.2;
  const totalX = cols * cellSizeX;
  const totalZ = rows * cellSizeZ;
  const back = block(totalX + wallT * 2, wallH, wallT, 'brick_grey');
  back.position.set(originX + totalX / 2, floorY + wallH / 2, originZ - wallT / 2);
  back.castShadow = true;
  scene.add(back);
  const left = block(wallT, wallH, totalZ, 'brick_grey');
  left.position.set(originX - wallT / 2, floorY + wallH / 2, originZ + totalZ / 2);
  left.castShadow = true;
  scene.add(left);
  const right = block(wallT, wallH, totalZ, 'brick_grey');
  right.position.set(originX + totalX + wallT / 2, floorY + wallH / 2, originZ + totalZ / 2);
  right.castShadow = true;
  scene.add(right);
  const gateW = cellSizeX * 5;
  const sideW = (totalX - gateW) / 2;
  const frontL = block(sideW, wallH, wallT, 'brick_grey');
  frontL.position.set(originX + sideW / 2, floorY + wallH / 2, originZ + totalZ + wallT / 2);
  frontL.castShadow = true;
  scene.add(frontL);
  const frontR = block(sideW, wallH, wallT, 'brick_grey');
  frontR.position.set(originX + totalX - sideW / 2, floorY + wallH / 2, originZ + totalZ + wallT / 2);
  frontR.castShadow = true;
  scene.add(frontR);

  // Throne — large gold base + dark backing at back-center (col 3)
  const thronePos = { x: originX + 5.5 * cellSizeX, z: originZ + 0.3 * cellSizeZ };
  const throneBase = block(cellSizeX * 1.6, 1.5, cellSizeZ * 0.7, 'gold');
  throneBase.position.set(thronePos.x, floorY + 0.75, thronePos.z);
  throneBase.castShadow = true;
  scene.add(throneBase);
  const throneBack = block(cellSizeX * 1.6, 4, cellSizeZ * 0.4, 'dark');
  throneBack.position.set(thronePos.x, floorY + 3.5, thronePos.z - cellSizeZ * 0.2);
  throneBack.castShadow = true;
  scene.add(throneBack);

  // Banners flanking throne
  for (const dx of [-cellSizeX * 1.8, cellSizeX * 1.8]) {
    const banner = block(2, 4, 0.3, 'cotton_red');
    banner.position.set(thronePos.x + dx, floorY + 4.5, originZ + 0.4);
    scene.add(banner);
  }

  // Front torches
  for (const c of [1, cols - 2]) {
    const x = originX + c * cellSizeX + cellSizeX / 2;
    const z = originZ + (rows - 1) * cellSizeZ + cellSizeZ / 2;
    const flame = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), blockMats['lava_top']);
    flame.position.set(x, floorY + 5, z);
    scene.add(flame);
    const torch = new THREE.PointLight(0xff8844, 2.5, 35, 1.5);
    torch.position.set(x, floorY + 5.4, z);
    scene.add(torch);
  }

  // Throne torches (warmer, more dramatic)
  for (const dx of [-cellSizeX * 1.2, cellSizeX * 1.2]) {
    const x = thronePos.x + dx;
    const z = originZ + 0.5;
    const flame = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), blockMats['lava_top']);
    flame.position.set(x, floorY + 4, z);
    scene.add(flame);
    const torch = new THREE.PointLight(0xff5522, 3, 25, 1.5);
    torch.position.set(x, floorY + 4.4, z);
    scene.add(torch);
  }
}

function revealOutcome() {
  const snap = serverState; if (!snap) return;
  if (snap.outcome === 'victory') {
    document.getElementById('victory').style.display = 'flex';
    renderLevelUpPanel({ victoryEl: document.getElementById('victory'), send, me: snap.players.find(p => p.pid === myPid) });
    if (!window._victoryPlayed) { window._victoryPlayed = true; playSFX('victory'); }
  } else if (snap.outcome === 'defeat') {
    document.getElementById('game-over').style.display = 'flex';
    if (!window._defeatPlayed) { window._defeatPlayed = true; playSFX('defeat'); }
  }
}

async function applyState(snap) {
  serverState = snap;

  document.body.classList.toggle('not-my-turn', !!serverState && serverState.activeTurnPid !== myPid && !serverState.outcome && !debugBotsAreActive());

  const seenPids = new Set();
  for (const p of snap.players) {
    seenPids.add(p.pid);
    let entry = playerTokens.get(p.pid);
    if (!entry && !loadingPids.has(p.pid)) {
      loadingPids.add(p.pid);
      const group = await loadPlayerTokenForRole(p.role, p.color);
      const { label, fillEl, nameEl } = buildPlayerLabel(p.name);
      if (p.pid !== myPid) {
        const c = cssColorForKey(p.color);
        if (c) label.style.borderColor = c; // teammates: nametag border = their color ("me" keeps the gold .me highlight)
      }
      document.body.appendChild(label);
      scene.add(group);
      entry = { group, label, fillEl, nameEl, role: p.role };
      playerTokens.set(p.pid, entry);
      loadingPids.delete(p.pid);
    }
    if (entry) {
      updatePlayerLabelHp(entry.fillEl, p.hp, p.maxHp);
      updatePoisonBadge(entry.label, p.poison);
      if (p.pid === myPid) updateLevelChip(p);
      const pos = gridToWorld(p.col, p.row);
      const ud = entry.group.userData;
      if (!ud.targetPos) {
        entry.group.position.set(pos.x, gridData.grid.floorY, pos.z);
      } else if (ud.kind === 'slime') {
        const dx = pos.x - ud.targetPos.x;
        const dz = pos.z - ud.targetPos.z;
        if (Math.abs(dx) > 0.01 || Math.abs(dz) > 0.01) {
          const cur = entry.group.position;
          ud.jumpStart = performance.now();
          playSFX('jump');
          ud.jumpFrom = new THREE.Vector3(cur.x, gridData.grid.floorY, cur.z);
          ud.jumpTo   = new THREE.Vector3(pos.x, gridData.grid.floorY, pos.z);
          const dist  = Math.hypot(pos.x - cur.x, pos.z - cur.z);
          ud.jumpDuration = Math.min(750, 320 + dist * 28);
        }
      }
      ud.targetPos = pos;
    }
  }
  for (const [pid, entry] of [...playerTokens.entries()]) {
    if (!seenPids.has(pid) && !entry._dying) {
      entry._dying = true;
    }
  }

  reconcileEnemies(snap.enemies);

  // Action panel sync — pendingKey lets us re-render across kind transitions
  // (e.g. pendingChoice → pendingHeal); without it the stale panel stuck.
  const pendingKey = snap.pendingCombat    ? `combat:${snap.pendingCombat.enemyId}` :
                     snap.pendingHeal      ? `heal:${snap.pendingHeal.healerPid}>${snap.pendingHeal.targetPid}` :
                     snap.pendingChallenge ? `chal:${snap.pendingChallenge.challengeId}` :
                     snap.pendingChoice    ? `choice:${snap.pendingChoice.step}:${snap.pendingChoice.actorPid}` :
                     null;
  const panelOpen = document.getElementById('event-panel').classList.contains('visible');
  const needsReopen = pendingKey && pendingKey !== lastPendingKey;
  if (snap.pendingCombat) {
    const enemy = snap.enemies.find(e => e.id === snap.pendingCombat.enemyId);
    const isAttacker = isControlledBy(snap.pendingCombat.attackerPid);
    if (enemy && (!panelOpen || needsReopen)) openCombatPanel(enemy, isAttacker);
  } else if (snap.pendingHeal) {
    const target = snap.players.find(p => p.pid === snap.pendingHeal.targetPid);
    const isHealer = isControlledBy(snap.pendingHeal.healerPid);
    if (target && (!panelOpen || needsReopen)) openHealPanel(target, isHealer);
  } else if (snap.pendingChallenge && snap.challenges) {
    const challenge = snap.challenges.find(c => c.id === snap.pendingChallenge.challengeId);
    const isActor = isControlledBy(snap.pendingChallenge.actorPid);
    if (challenge && (!panelOpen || needsReopen)) openChallengePanel(challenge, isActor);
  } else if (snap.pendingChoice) {
    const isActor = isControlledBy(snap.pendingChoice.actorPid);
    openChoicePanel(snap.pendingChoice, snap, isActor);
  } else {
    closeCombatPanel();
  }
  lastPendingKey = pendingKey;

  // Outcome overlays
  if (!snap.outcome) { // fresh state (e.g. a replayed stage) — clear any stale overlay
    const _v = document.getElementById('victory'); if (_v) { _v.style.display = 'none'; _v.style.opacity = ''; }
    const _go = document.getElementById('game-over'); if (_go) _go.style.display = 'none';
    window._victoryFaded = false; window._defeatPlayed = false;
    window._pendingOutcome = false; clearTimeout(window._outcomeTimer);
  }
  if (snap.outcome) {
    const panelVisible = document.getElementById('event-panel').classList.contains('visible');
    if (panelVisible) {
      window._pendingOutcome = true;
      // spectators have no Continue button — reveal after a short beat as a fallback
      clearTimeout(window._outcomeTimer);
      window._outcomeTimer = setTimeout(() => { if (window._pendingOutcome) { window._pendingOutcome = false; revealOutcome(); } }, 2600);
    } else {
      revealOutcome();
    }
  }

  const turnPid = snap.activeTurnPid;
  const turnPlayer = snap.players.find(p => p.pid === turnPid);
  const canDriveTurn = turnPid === myPid || debugBotsAreActive();
  if (turnPlayer && canDriveTurn && !snap.pendingCombat && !snap.pendingHeal && !snap.pendingChallenge && !snap.outcome && !_enemyPhaseAnimating) {
    showMoveRange(turnPlayer.col, turnPlayer.row, turnPlayer.role);
  } else {
    clearHighlights();
  }

  updateHUD();
}

let _enemyPhaseAnimating = false;
function reconcileEnemies(enemiesFromServer) {
  for (const srvE of enemiesFromServer) {
    const local = enemyTokens.find(e => e.id === srvE.id);
    if (!local) continue;
    local.hp = srvE.hp;
    if (local.fillEl) updatePlayerLabelHp(local.fillEl, srvE.hp, srvE.maxHp);
    // Positions are server-authoritative. Without this, a page reload (or a
    // missed enemy_phase) leaves enemies rendered at their authored spawns
    // while the server has them advanced — the client then blocks/permits the
    // wrong movement tiles. Skipped mid-animation; the enemy-phase handler
    // trues positions up when it finishes.
    if (!_enemyPhaseAnimating && (local.col !== srvE.col || local.row !== srvE.row)) {
      local.col = srvE.col;
      local.row = srvE.row;
      if (local.mesh) {
        const pos = gridToWorld(srvE.col, srvE.row);
        local.mesh.position.set(pos.x, gridData.grid.floorY, pos.z);
      }
    }
    if (srvE.hp <= 0 && local.mesh.parent) {
      scene.remove(local.mesh);
      if (local.label) { local.label.remove(); local.label = null; }
    }
  }
}

function showMoveRange(col, row, role) {
  clearHighlights();
  const effRole = role || charData?.role;
  const tiles = calcMoveRange(col, row, MOVE_RANGE_BY_ROLE[effRole] || 4);
  const { cellSizeX, cellSizeZ, floorY } = gridData.grid;
  tiles.forEach(tile => {
    const isSelf = tile.col === col && tile.row === row;
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(cellSizeX * 0.85, cellSizeZ * 0.85),
      new THREE.MeshBasicMaterial({
        color: isSelf ? 0xc8a96e : 0xaa2222,
        transparent: true,
        opacity: isSelf ? 0.25 : 0.35,
        side: THREE.DoubleSide,
      })
    );
    plane.rotation.x = -Math.PI / 2;
    const pos = gridToWorld(tile.col, tile.row);
    plane.position.set(pos.x, floorY + 0.05, pos.z);
    plane.userData = { kind: 'move', col: tile.col, row: tile.row };
    highlightGroup.add(plane);
    highlightMeshes.push(plane);
  });

  // Sky-blue tiles for enemies attackable from current position (instant attack).
  const atkRange = ATTACK_RANGE_BY_ROLE[effRole] || 1;
  enemyTokens.forEach(e => {
    if (e.hp <= 0) return;
    if (!inAtkRange(col, row, e.col, e.row, atkRange)) return;
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(cellSizeX * 0.9, cellSizeZ * 0.9),
      new THREE.MeshBasicMaterial({
        color: 0x66ccff,
        transparent: true,
        opacity: 0.5,
        side: THREE.DoubleSide,
      })
    );
    plane.rotation.x = -Math.PI / 2;
    const pos = gridToWorld(e.col, e.row);
    plane.position.set(pos.x, floorY + 0.06, pos.z);
    plane.userData = { kind: 'attack', col: e.col, row: e.row };
    highlightGroup.add(plane);
    highlightMeshes.push(plane);
  });
}

function clearHighlights() {
  highlightMeshes.forEach(m => highlightGroup.remove(m));
  highlightMeshes.length = 0;
}

// Async grid + state setup
(async () => {
  const resp = await fetch('../rooms/stage05-grid.json');
  gridData = await resp.json();

  // Build the voxel throne scene procedurally — depends on gridData
  buildThroneScene();
  decorateThroneKit();

  // ── Entry cinematic: Lyra is dragged to the vault; the King taunts. Plays once. ──
  if (!sessionStorage.getItem('s05-intro-' + (localStorage.getItem('session-code') || ''))) {
    sessionStorage.setItem('s05-intro-' + (localStorage.getItem('session-code') || ''), '1');
    const g = gridData.grid;
    const cell = (c, r) => new THREE.Vector3(g.originX + c * g.cellSizeX + g.cellSizeX / 2, g.floorY, g.originZ + r * g.cellSizeZ + g.cellSizeZ / 2);
    const cx = (g.cols - 1) / 2;
    const cLyra = placeLyraSlime(scene, cell(cx, 1), 4);
    cLyra.userData.crying = true;
    (cLyra.userData.normalEyes || []).forEach(e => e.visible = false);
    (cLyra.userData.cryEyes || []).forEach(e => e.visible = true);
    const cGobs = [placeGoblinBox(scene, cell(cx - 1, 1), 3), placeGoblinBox(scene, cell(cx + 1, 1), 3)];
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:120;max-width:80%;text-align:center;font-family:Georgia,serif;font-size:26px;letter-spacing:1px;color:#ffd0d0;text-shadow:0 0 18px rgba(0,0,0,.9);padding:10px 20px';
    banner.textContent = 'Goblin King: "Want the healer back? Cut me down first!"';
    document.body.appendChild(banner);
    const skip = document.createElement('button');
    skip.textContent = 'Skip ▶';
    skip.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:121;padding:8px 16px;background:rgba(0,0,0,.6);border:1px solid rgba(200,169,110,.5);border-radius:5px;color:#ffe9a0;font-family:Georgia,serif;cursor:pointer';
    document.body.appendChild(skip);
    const start = performance.now(), DUR = 6000;
    let done = false;
    const finish = () => { if (done) return; done = true; banner.remove(); skip.remove(); scene.remove(cLyra); cGobs.forEach(x => scene.remove(x)); };
    skip.addEventListener('click', finish);
    const lerpY = (o, ax, az, bx, bz, t) => { o.position.x = ax + (bx - ax) * t; o.position.z = az + (bz - az) * t; };
    (function cine(now) {
      if (done) return;
      const t = Math.min(1, (now - start) / DUR);
      const from = cell(cx, 1), to = cell(cx, -2.2);
      lerpY(cLyra, from.x, from.z, to.x, to.z, t);
      cGobs.forEach((gob, i) => { const fx = cell(cx + (i ? 1 : -1), 1); lerpY(gob, fx.x, fx.z, to.x + (i ? 1 : -1) * 4, to.z, t); });
      if (t >= 1) { finish(); return; }
      requestAnimationFrame(cine);
    })(start);
  }

  // Larger map: keep the camera's angle/distance (characters stay the same size),
  // frame the party spawn at start, and let players pan within the map bounds.
  {
    const gg = gridData.grid;
    const centerX = gg.originX + gg.cols * gg.cellSizeX / 2;   // lock horizontal pan to map center
    const camOffset = BASE_CAM_POS.clone().sub(LOOK_TARGET);   // target -> camera vector
    const sp = gridToWorld(gridData.playerSpawn[0], gridData.playerSpawn[1]);
    const viewTarget = new THREE.Vector3(centerX, LOOK_TARGET.y, sp.z); // centered X, spawn Z
    controls.target.copy(viewTarget);
    camera.position.copy(viewTarget).add(camOffset);
    camera.lookAt(viewTarget);
    const minZ = gg.originZ, maxZ = gg.originZ + gg.rows * gg.cellSizeZ;
    // Pan up/down only: X stays at centerX, Z clamps to the map bounds.
    controls.addEventListener('change', () => {
      const t = controls.target;
      const cz = Math.min(maxZ, Math.max(minZ, t.z));
      if (t.x !== centerX || cz !== t.z) {
        camera.position.x += centerX - t.x;
        camera.position.z += cz - t.z;
        t.set(centerX, t.y, cz);
      }
    });
    controls.update();
  }

  const floorGeo = new THREE.PlaneGeometry(200, 200);
  floorPlane = new THREE.Mesh(
    floorGeo,
    new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })
  );
  floorPlane.rotation.x = -Math.PI / 2;
  floorPlane.position.y = gridData.grid.floorY;

  // Render visible challenge markers — emoji sprites for stat challenges, real well for healing.
  if (gridData.challenges) {
    const challengeEmoji = { agi: '🌉', lck: '😴', int: '🔓', str: '💪' };
    for (const ch of gridData.challenges) {
      const pos = gridToWorld(ch.col, ch.row);
      { const cs = gridData.grid;
        const tile = new THREE.Mesh(
          new THREE.PlaneGeometry(cs.cellSizeX * 0.9, cs.cellSizeZ * 0.9),
          new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
        );
        tile.rotation.x = -Math.PI / 2;
        tile.position.set(pos.x, cs.floorY + 0.04, pos.z);
        tile.renderOrder = 2;
        scene.add(tile);
      }
      if (ch.successHp > 0) { // healing node → a real well (like the intro village), not an emoji
        placeWell(scene, blockMats, pos.x, pos.z, gridData.grid.floorY);
        continue;
      }
      const emoji = challengeEmoji[ch.stat] || '❓';
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.font = '180px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 128, 140);
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      const height = 2.5;
      sprite.scale.set(height, height, 1);
      sprite.position.y = height / 2;
      const group = new THREE.Group();
      group.add(sprite);
      group.position.set(pos.x, gridData.grid.floorY + 1.0, pos.z);
      scene.add(group);
    }
  }

  placeEnemies();

  on('state_update', (msg) => {
    applyState(msg.state).catch(err => console.error('[state_update] applyState failed:', err));
  });

  const urlParams = new URLSearchParams(location.search);
  const isSpectator = urlParams.get('spectator') === '1';
  const hasSession = !!localStorage.getItem('session-code');

// Monster turn (stage04+): enemies slide toward the party and strike. The
// server has already resolved positions/HP; this just animates the result.
on('enemy_phase', async (msg) => {
  _enemyPhaseAnimating = true;
  // Movement input is gated while the monsters act (tiles would be computed
  // against mid-animation positions) — say so, or a long phase reads as a freeze.
  let _epBanner = document.getElementById('enemy-turn-banner');
  if (!_epBanner) {
    _epBanner = document.createElement('div');
    _epBanner.id = 'enemy-turn-banner';
    _epBanner.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:70;padding:6px 18px;background:rgba(40,10,10,.85);border:1px solid rgba(220,120,90,.5);border-radius:9px;color:#f0b8a0;font-size:13px;letter-spacing:1.5px;pointer-events:none;transition:opacity .3s';
    document.body.appendChild(_epBanner);
  }
  _epBanner.textContent = '⚔ ENEMY TURN…';
  _epBanner.style.opacity = '1';
  const slide = (mesh, to, ms) => new Promise(res => {
    const from = mesh.position.clone(); to.y = mesh.position.y;
    const t0 = performance.now();
    (function step(now){ const t = Math.min(1, (now - t0) / ms); mesh.position.lerpVectors(from, to, t); if (t < 1) requestAnimationFrame(step); else res(); })(performance.now());
    setTimeout(res, ms + 400); // backstop: rAF stalls in hidden/throttled tabs — a slide must never hang the phase
  });
  const pop = (obj, k = 1.18, ms = 130) => { if (!obj) return; const s = obj.scale.x; obj.scale.setScalar(s * k); setTimeout(() => obj.scale.setScalar(s), ms); };
  const nap = ms => new Promise(r => setTimeout(r, ms));
  try {
  for (const act of (msg.actions || [])) {
    const ent = enemyTokens.find(e => e.id === act.enemyId);
    if (!ent || !ent.mesh) continue;
    const path = act.path || [];
    if (path.length) {
      const [fc, fr] = path[path.length - 1];
      ent.col = fc; ent.row = fr;
      await slide(ent.mesh, gridToWorld(fc, fr), Math.min(1000, 360 * path.length));
    }
    if (act.attack) {
      pop(ent.mesh, 1.22, 150);            // enemy lunges
      const tgt = playerTokens.get(act.attack.pid);
      if (tgt) {
        pop(tgt.group, 1.18, 140);         // victim recoils
        const mp = serverState?.players?.find(p => p.pid === act.attack.pid)?.maxHp || act.attack.hpAfter;
        if (tgt.fillEl) updatePlayerLabelHp(tgt.fillEl, act.attack.hpAfter, mp);
      }
      playSFX('attack_melee');
      await nap(520);
    }
    await nap(180);
  }
  } finally {
    // Always release the input gate — an exception or a stalled animation must
    // never leave the player unable to act.
    _enemyPhaseAnimating = false;
    const _epb = document.getElementById('enemy-turn-banner');
    if (_epb) _epb.style.opacity = '0';
    if (serverState?.enemies) reconcileEnemies(serverState.enemies);
    // Re-render movement tiles now that enemy positions are final — the tiles
    // drawn when state_update arrived were computed against mid-animation
    // (stale) enemy cells and can block or expose the wrong squares.
    if (serverState) applyState(serverState);
  }
});

function tick() {
  requestAnimationFrame(tick);

  // Player token animation — slimes get jump + idle wobble; others fall back to lerp+bob
  if (gridData) {
    const now = performance.now();
    for (const [pid, entry] of playerTokens) {
      if (entry._dying) {
        if (fadeOutToken(entry, now)) {
          scene.remove(entry.group);
          entry.label.remove();
          playerTokens.delete(pid);
        }
        continue;
      }
      const ud = entry.group.userData;
      const target = ud.targetPos;
      if (!target) continue;
      if (ud.kind === 'slime') {
        if (ud.jumpStart == null) {
          entry.group.position.x = target.x;
          entry.group.position.z = target.z;
        }
        updateSlimeAnimation(entry.group, now, gridData.grid.floorY);
      } else {
        entry.group.position.lerp(target, 0.1);
        entry.group.position.y = gridData.grid.floorY + Math.sin(now * 0.002) * 0.06;
      }
    }
  }

  // Update enemy HP label screen positions
  const _labelVec = new THREE.Vector3();
  enemyTokens.forEach(e => {
    if (!e.label) return;
    _labelVec.copy(e.mesh.position);
    _labelVec.y += 7;
    _labelVec.project(camera);
    const x = (_labelVec.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-_labelVec.y * 0.5 + 0.5) * window.innerHeight;
    e.label.style.left = x + 'px';
    e.label.style.top = y + 'px';
  });

  // Update player name label positions
  const _pVec = new THREE.Vector3();
  for (const [pid, entry] of playerTokens) {
    _pVec.copy(entry.group.position);
    _pVec.y += 7;
    _pVec.project(camera);
    const x = (_pVec.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-_pVec.y * 0.5 + 0.5) * window.innerHeight;
    entry.label.style.left = x + 'px';
    entry.label.style.top  = y + 'px';
    if (pid === myPid && entry.nameEl) entry.nameEl.classList.add('me');
    if (entry.nameEl) entry.nameEl.classList.toggle('active-turn', !!serverState && !serverState.outcome && pid === serverState.activeTurnPid);
  }

  controls.update();
  // ── Active-turn ground ring under the current player's slime ──
  if (gridData) {
    let ring = scene.userData.turnRing;
    if (!ring) {
      ring = new THREE.Mesh(
        new THREE.RingGeometry(1.5, 2.1, 48),
        new THREE.MeshBasicMaterial({ color: 0xffe97a, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.renderOrder = 4;
      scene.add(ring);
      scene.userData.turnRing = ring;
    }
    const activePid = (serverState && !serverState.outcome) ? serverState.activeTurnPid : null;
    const activeEntry = activePid ? playerTokens.get(activePid) : null;
    if (activeEntry) {
      const gp = activeEntry.group.position;
      ring.position.set(gp.x, gridData.grid.floorY + 0.08, gp.z);
      const tt = performance.now() * 0.005;
      const s = 1 + Math.sin(tt) * 0.12;
      ring.scale.set(s, s, 1);
      ring.material.opacity = 0.45 + (Math.sin(tt) * 0.5 + 0.5) * 0.4;
      ring.visible = true;
    } else {
      ring.visible = false;
    }
  }
  renderer.render(scene, camera);
}
tick();
</script>

<script type="module" src="../scripts/chat-panel.js"></script>
<script type="module" src="../scripts/player-session.js"></script>
</body>
</html>
