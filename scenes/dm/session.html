<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Lite — DM Session</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    height: 100vh;
    font-family: 'Georgia', serif;
    color: #c8a96e;
    display: grid;
    /* sidebar · observation dashboard (chat panel is foldable, floats on top) */
    grid-template-columns: 320px minmax(0, 1fr);
    grid-template-rows: 66px 1fr;
  }

  /* ── Header ─────────────────────────────────────────── */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    padding: 0 28px;
    border-bottom: 1px solid rgba(200,169,110,.14);
    gap: 18px;
  }
  header h1 {
    font-size: 14px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(200,169,110,.6);
  }
  .code-badge {
    font-size: 24px;
    letter-spacing: 7px;
    color: #ffe9a0;
    font-family: monospace;
    border: 1px solid rgba(200,169,110,.25);
    padding: 4px 16px;
    border-radius: 5px;
  }
  #status {
    margin-left: auto;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(200,169,110,.4);
    text-transform: uppercase;
  }

  /* ── Sidebar (players + controls) ───────────────────── */
  aside {
    grid-column: 1;
    border-right: 1px solid rgba(200,169,110,.12);
    padding: 22px 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .panel-title {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(200,169,110,.42);
    margin-bottom: 12px;
    padding-bottom: 7px;
    border-bottom: 1px solid rgba(200,169,110,.12);
  }
  .player-row {
    padding: 10px 0;
    border-bottom: 1px solid rgba(200,169,110,.07);
    font-size: 14px;
    letter-spacing: .5px;
  }
  .player-row .name { color: rgba(200,169,110,.92); }
  .player-row .loc  { font-size: 12px; color: rgba(200,169,110,.4); margin-top: 3px; }
  #no-players { font-size: 13px; color: rgba(200,169,110,.28); letter-spacing: 1px; }

  .btn-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  button.dm-btn {
    flex: 1 1 calc(50% - 4px);
    padding: 11px 12px;
    background: rgba(200,169,110,.07);
    border: 1px solid rgba(200,169,110,.25);
    border-radius: 5px;
    color: rgba(200,169,110,.75);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Georgia', serif;
    transition: all .2s;
    text-align: center;
    white-space: nowrap;
  }
  button.dm-btn:hover { background: rgba(200,169,110,.18); color: #ffe9a0; border-color: rgba(200,169,110,.5); }
  button.dm-btn.active { background: rgba(200,169,110,.25); color: #ffe9a0; border-color: rgba(200,169,110,.7); }

  /* ── Main: stage observation dashboard ─────────────── */
  main {
    grid-column: 2;
    padding: 22px 26px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .main-title {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(200,169,110,.45);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(200,169,110,.12);
  }

  #stage-empty {
    font-size: 16px;
    color: rgba(200,169,110,.3);
    letter-spacing: 1px;
    padding: 60px 0;
    text-align: center;
  }
  #stage-view.active #stage-empty { display: none; }
  #stage-view:not(.active) .stage-header,
  #stage-view:not(.active) [data-active-only] { display: none; }

  .stage-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .stage-header .label { font-size: 19px; color: #ffe9a0; letter-spacing: 2px; }
  .turn-pill {
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
    background: rgba(200,169,110,.12);
    color: #ffe9a0;
    border: 1px solid rgba(200,169,110,.3);
  }
  .pending-pill {
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
    background: rgba(232,93,93,.15);
    color: #ff9090;
    border: 1px solid rgba(232,93,93,.4);
  }
  .pending-pill.heal      { background: rgba(120,200,120,.18); color: #9fe89f; border-color: rgba(120,200,120,.4); }
  .pending-pill.challenge { background: rgba(120,170,255,.18); color: #a5c4ff; border-color: rgba(120,170,255,.4); }
  .pending-pill.choice    { background: rgba(232,180,80,.18); color: #ffd58c; border-color: rgba(232,180,80,.4); }
  /* DM override: skip a stuck/disconnected player's turn */
  .skip-turn-btn {
    margin-left: auto;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 4px;
    background: rgba(232,93,93,.12);
    color: #ff9d9d;
    border: 1px solid rgba(232,93,93,.4);
    cursor: pointer;
    font-family: 'Georgia', serif;
    transition: all .2s;
  }
  .skip-turn-btn:hover { background: rgba(232,93,93,.25); color: #ffd0d0; border-color: rgba(232,93,93,.7); }

  /* iframe (left, large) + live entity panels (right column) */
  .observe-body {
    display: grid;
    /* iframe fills all remaining width; entity column stays a readable fixed band */
    grid-template-columns: minmax(0, 1fr) minmax(300px, 400px);
    gap: 22px;
    align-items: start;
  }
  #stage-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid rgba(200,169,110,.18);
    border-radius: 8px;
    background: #000;
    display: block;
  }
  .observe-right { display: flex; flex-direction: column; gap: 18px; }
  .entity-section-label {
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(200,169,110,.45);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .entity-grid { display: flex; flex-direction: column; gap: 8px; }
  .entity-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(200,169,110,.1);
    border-radius: 5px;
    font-size: 14px;
  }
  .entity-row.active-turn { border-color: rgba(255,233,160,.6); background: rgba(255,233,160,.06); }
  .entity-row.dead { opacity: .35; }
  .entity-row.enemy { border-color: rgba(232,93,93,.18); }
  .entity-row.challenge { border-color: rgba(120,170,255,.2); }
  .entity-row.challenge.cleared { opacity: .4; }
  .entity-name { color: #ffe9a0; letter-spacing: .5px; font-size: 14px; }
  .entity-name .role { font-size: 11px; color: rgba(200,169,110,.5); margin-left: 6px; }
  .entity-pos { font-size: 12px; color: rgba(200,169,110,.5); font-family: monospace; }
  .entity-hp { font-size: 13px; color: #c8a96e; font-family: monospace; min-width: 70px; text-align: right; }
  .entity-row.enemy .entity-hp { color: #e85d5d; }
  .entity-row.challenge .entity-hp { color: #88b8ff; font-size: 12px; letter-spacing: 1px; }

  /* Narrow screens: drop the chat gutter and stack the dashboard */
  @media (max-width: 1180px) {
    body { grid-template-columns: 300px 1fr; }
    main { grid-column: 2; }
    .observe-body { grid-template-columns: 1fr; }
    #stage-frame { max-width: 720px; }
  }
</style>
</head>
<body>

<header>
  <h1>DM Control</h1>
  <span class="code-badge" id="code-badge">----</span>
  <span id="status">Connecting…</span>
</header>

<aside>
  <div>
    <div class="panel-title">Players</div>
    <div id="player-list"><span id="no-players">None connected</span></div>
  </div>

  <div>
    <div class="panel-title">Unlock Stages</div>
    <div class="btn-grid" id="stage-btns">
      <button class="dm-btn" data-action="unlock" data-stage="stage_01">Stage 01</button>
      <button class="dm-btn" data-action="unlock" data-stage="stage_02">Stage 02</button>
      <button class="dm-btn" data-action="unlock" data-stage="stage_03">Stage 03</button>
      <button class="dm-btn" data-action="unlock" data-stage="stage_04">Stage 04</button>
      <button class="dm-btn" data-action="unlock" data-stage="stage_05">Stage 05</button>
    </div>
  </div>

  <div>
    <div class="panel-title">Send Players To</div>
    <div class="btn-grid">
      <button class="dm-btn" data-action="redirect" data-url="cutscene.html" style="flex:1 1 100%;background:rgba(200,169,110,.18);color:#ffe9a0;border-color:rgba(200,169,110,.6)">▶ Start Adventure (Intro)</button>
      <button class="dm-btn" data-action="redirect" data-url="world-map.html">World Map</button>
      <button class="dm-btn" data-action="redirect" data-url="stage01.html">Stage 01</button>
      <button class="dm-btn" data-action="redirect" data-url="stage02.html">Stage 02</button>
      <button class="dm-btn" data-action="redirect" data-url="stage03.html">Stage 03</button>
      <button class="dm-btn" data-action="redirect" data-url="stage04.html">Stage 04</button>
      <button class="dm-btn" data-action="redirect" data-url="stage05.html">Stage 05</button>
    </div>
  </div>
</aside>

<main>
  <div class="main-title">Stage Observation</div>
  <section id="stage-view">
    <div id="stage-empty">No players in a combat stage yet.</div>

    <div class="stage-header">
      <span class="label" id="stage-label"></span>
      <span class="turn-pill" id="turn-pill"></span>
      <span class="pending-pill" id="pending-pill" style="display:none">Combat</span>
      <button class="skip-turn-btn" id="skip-turn-btn" style="display:none">Skip Turn ⏭</button>
    </div>

    <div class="observe-body" data-active-only>
      <div class="observe-left">
        <iframe id="stage-frame"></iframe>
      </div>
      <div class="observe-right">
        <div>
          <div class="entity-section-label">Party</div>
          <div class="entity-grid" id="party-list"></div>
        </div>
        <div>
          <div class="entity-section-label">Enemies</div>
          <div class="entity-grid" id="enemy-list"></div>
        </div>
        <div id="challenge-section" style="display:none">
          <div class="entity-section-label">Challenges</div>
          <div class="entity-grid" id="challenge-list"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="../../scripts/chat-panel.js"></script>
<script type="module">
import { connect, send, on } from '../../scripts/game-socket.js';
import { cssColorForKey } from '../../scripts/colors.js';

const params = new URLSearchParams(location.search);
const code = params.get('code') || localStorage.getItem('dm-session-code');

document.getElementById('code-badge').textContent = code || '----';

const players = new Map();
const playerList = document.getElementById('player-list');
const noPlayers  = document.getElementById('no-players');
const statusEl   = document.getElementById('status');

function renderPlayers() {
  playerList.innerHTML = '';
  if (players.size === 0) {
    playerList.appendChild(noPlayers);
    return;
  }
  for (const [id, p] of players) {
    const div = document.createElement('div');
    div.className = 'player-row';
    div.id = `player-${id}`;

    const nameDiv = document.createElement('div');
    nameDiv.className = 'name';
    const roleSpan = document.createElement('span');
    roleSpan.style.cssText = 'opacity:.4;font-size:11px';
    roleSpan.textContent = p.role;
    nameDiv.appendChild(document.createTextNode(p.name + ' '));
    nameDiv.appendChild(roleSpan);

    const locDiv = document.createElement('div');
    locDiv.className = 'loc';
    locDiv.id = `loc-${id}`;
    locDiv.textContent = p.location;

    const dot = document.createElement('span');
    dot.style.cssText = `display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle;background:${cssColorForKey(p.color) || '#888'}`;
    nameDiv.prepend(dot);

    div.append(nameDiv, locDiv);
    playerList.appendChild(div);
  }
}

on('session_created', () => {});

on('player_joined', (msg) => {
  players.set(msg.playerId, { name: msg.name, role: msg.role, color: msg.color, location: 'world-map' });
  renderPlayers();
});

on('player_left', (msg) => {
  players.delete(msg.playerId);
  renderPlayers();
});

on('lobby_state', (msg) => {
  for (const p of msg.players) {
    const existing = players.get(p.pid) || {};
    players.set(p.pid, { ...existing, name: p.name, role: p.role, color: p.color });
  }
  renderPlayers();
});

on('player_location', (msg) => {
  const p = players.get(msg.playerId);
  if (p) {
    p.location = msg.location;
    const locEl = document.getElementById(`loc-${msg.playerId}`);
    if (locEl) locEl.textContent = msg.location;
  }
});

on('stage_unlock_ack', (msg) => {
  const btn = [...document.querySelectorAll('[data-stage]')]
    .find(el => el.dataset.stage === msg.stageKey);
  if (btn) btn.classList.add('active');
});

on('dm_rejoined', (msg) => {
  players.clear();
  for (const p of msg.players) {
    players.set(p.playerId, { name: p.name, role: p.role, color: p.color, location: p.location });
  }
  renderPlayers();
  for (const stageKey of msg.unlockedStages) {
    const btn = [...document.querySelectorAll('[data-stage]')]
      .find(el => el.dataset.stage === stageKey);
    if (btn) btn.classList.add('active');
  }
});

// Stage observation
const stageView   = document.getElementById('stage-view');
const stageLabel  = document.getElementById('stage-label');
const turnPill    = document.getElementById('turn-pill');
const pendingPill = document.getElementById('pending-pill');
const partyList   = document.getElementById('party-list');
const enemyList   = document.getElementById('enemy-list');
const challengeSection = document.getElementById('challenge-section');
const challengeList    = document.getElementById('challenge-list');

const stageFrame = document.getElementById('stage-frame');
const skipTurnBtn = document.getElementById('skip-turn-btn');
let frameStageId = null;
let lastState = null;

function renderStageState(state) {
  if (!state) { stageView.classList.remove('active'); return; }
  lastState = state;
  stageView.classList.add('active');
  stageLabel.textContent = state.stageId;

  if (state.stageId !== frameStageId && code) {
    stageFrame.src = `../${state.stageId}.html?spectator=1&code=${encodeURIComponent(code)}`;
    frameStageId = state.stageId;
  }

  const activeP = state.players.find(p => p.pid === state.activeTurnPid);
  turnPill.textContent = activeP ? `${activeP.name}'s turn` : 'No active turn';

  // Skip-turn override: available whenever a turn is active and the stage isn't
  // already resolved, so the DM can unstick a dropped/AFK player.
  if (activeP && !state.outcome) {
    skipTurnBtn.style.display = 'inline-block';
    skipTurnBtn.textContent = `Skip ${activeP.name}'s Turn ⏭`;
  } else {
    skipTurnBtn.style.display = 'none';
  }

  // pending-pill reflects every pending kind, not just combat
  pendingPill.className = 'pending-pill';
  const nameOf = (pid) => state.players.find(p => p.pid === pid)?.name || '?';
  if (state.pendingCombat) {
    const en = state.enemies.find(e => e.id === state.pendingCombat.enemyId);
    pendingPill.textContent = `Combat: ${nameOf(state.pendingCombat.attackerPid)} vs ${en?.name || '?'}`;
    pendingPill.style.display = 'inline-block';
  } else if (state.pendingHeal) {
    pendingPill.classList.add('heal');
    pendingPill.textContent = `Heal: ${nameOf(state.pendingHeal.healerPid)} → ${nameOf(state.pendingHeal.targetPid)}`;
    pendingPill.style.display = 'inline-block';
  } else if (state.pendingChallenge) {
    pendingPill.classList.add('challenge');
    const ch = (state.challenges || []).find(c => c.id === state.pendingChallenge.challengeId);
    pendingPill.textContent = `Challenge: ${nameOf(state.pendingChallenge.actorPid)} — ${ch?.name || '?'}`;
    pendingPill.style.display = 'inline-block';
  } else if (state.pendingChoice) {
    pendingPill.classList.add('choice');
    const step = state.pendingChoice.step === 'pick_target' ? 'pick heal target' : 'pick action';
    pendingPill.textContent = `Cleric (${nameOf(state.pendingChoice.actorPid)}): ${step}`;
    pendingPill.style.display = 'inline-block';
  } else {
    pendingPill.style.display = 'none';
  }

  partyList.innerHTML = '';
  for (const p of state.players) {
    const row = document.createElement('div');
    row.className = 'entity-row' + (p.pid === state.activeTurnPid ? ' active-turn' : '') + (p.hp <= 0 ? ' dead' : '');
    row.innerHTML = `
      <div class="entity-name"></div>
      <div class="entity-pos"></div>
      <div class="entity-hp"></div>
    `;
    const nameDiv = row.querySelector('.entity-name');
    nameDiv.textContent = p.name;
    const roleSpan = document.createElement('span');
    roleSpan.className = 'role';
    roleSpan.textContent = p.role;
    nameDiv.appendChild(roleSpan);
    row.querySelector('.entity-pos').textContent = `[${p.col},${p.row}]`;
    row.querySelector('.entity-hp').textContent = `${p.hp}/${p.maxHp} HP`;
    partyList.appendChild(row);
  }

  enemyList.innerHTML = '';
  for (const e of state.enemies) {
    const row = document.createElement('div');
    row.className = 'entity-row enemy' + (e.hp <= 0 ? ' dead' : '');
    row.innerHTML = `
      <div class="entity-name"></div>
      <div class="entity-pos"></div>
      <div class="entity-hp"></div>
    `;
    row.querySelector('.entity-name').textContent = e.name + (e.hp <= 0 ? ' (defeated)' : '');
    row.querySelector('.entity-pos').textContent = `[${e.col},${e.row}]`;
    row.querySelector('.entity-hp').textContent = `DC ${e.dc} · ${e.hp}/${e.maxHp} HP`;
    enemyList.appendChild(row);
  }

  // Challenges (stage_03 skill checks, stage_05 Lyra cage, etc.)
  const challenges = state.challenges || [];
  challengeList.innerHTML = '';
  if (challenges.length === 0) {
    challengeSection.style.display = 'none';
  } else {
    challengeSection.style.display = '';
    for (const c of challenges) {
      const row = document.createElement('div');
      row.className = 'entity-row challenge' + (c.cleared ? ' cleared' : '');
      row.innerHTML = `
        <div class="entity-name"></div>
        <div class="entity-pos"></div>
        <div class="entity-hp"></div>
      `;
      row.querySelector('.entity-name').textContent = c.name + (c.cleared ? ' ✓' : '');
      row.querySelector('.entity-pos').textContent = `[${c.col},${c.row}]`;
      row.querySelector('.entity-hp').textContent = c.cleared ? 'cleared' : `DC ${c.dc} ${c.stat}`;
      challengeList.appendChild(row);
    }
  }
}

on('state_update', (msg) => renderStageState(msg.state));

on('_disconnect', () => { statusEl.textContent = 'Disconnected'; });

connect(() => {
  if (code) {
    send({ type: 'dm_rejoin', code });
    statusEl.textContent = `Connected · session ${code}`;
  } else {
    statusEl.textContent = 'No session code — go back to lobby';
  }
});

skipTurnBtn.addEventListener('click', () => {
  if (lastState?.stageId) send({ type: 'dm_skip_turn', stageId: lastState.stageId });
});

document.querySelectorAll('button.dm-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const action = btn.dataset.action;
    if (action === 'unlock') {
      send({ type: 'stage_unlock', stageKey: btn.dataset.stage });
    } else if (action === 'redirect') {
      send({ type: 'player_redirect', url: btn.dataset.url });
    }
  });
});
</script>
</body>
</html>
