<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Lite — Choose Your Hero</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.176.0/"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #ffe9a0;
    --gold-dim: #e3c489;
    --line: rgba(255,233,160,.18);
    --panel: rgba(40,24,10,.42);
  }
  body {
    /* Warm wood / tavern gradient — D&D feel */
    background: radial-gradient(ellipse at 30% 0%, #a87c45, #6e4f2a 55%, #3c2a16 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    font-family: 'Georgia', serif; color: var(--gold-dim); padding: 30px 34px 40px;
  }

  /* Header */
  header { width: 100%; max-width: 1180px; display: flex; align-items: baseline; gap: 20px; margin-bottom: 24px; }
  header h1 { font-size: 17px; letter-spacing: 7px; text-transform: uppercase; color: var(--gold); }
  header .sub { font-size: 14px; letter-spacing: 5px; text-transform: uppercase; color: rgba(255,233,160,.55); }
  header .code { margin-left: auto; font-family: monospace; font-size: 23px; letter-spacing: 7px; color: var(--gold);
    border: 1px solid var(--line); padding: 6px 18px; border-radius: 6px; }

  /* Two-column stage */
  .stage { width: 100%; max-width: 1180px; flex: 1; display: grid; grid-template-columns: minmax(0,1fr) 400px; gap: 28px; align-items: start; }
  .section-label { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,233,160,.6); margin-bottom: 16px; }

  /* LEFT: party + color */
  .left { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px 30px; }
  #roster { display: flex; flex-wrap: wrap; gap: 16px; }
  .pcard {
    position: relative; width: 176px; padding: 8px 12px 16px; border-radius: 12px; text-align: center;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.22));
    border: 2px solid rgba(255,233,160,.16); transition: border-color .2s, box-shadow .2s;
  }
  .pcard.me { box-shadow: 0 0 22px rgba(255,233,160,.3), inset 0 0 0 1px rgba(255,233,160,.18); }
  .pcard .badge {
    position: absolute; top: 8px; left: 8px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: #3c2a16; background: var(--gold); padding: 2px 9px; border-radius: 999px; font-family: 'Georgia', serif;
  }
  .pcard canvas.pslime { width: 150px; height: 150px; display: block; margin: 0 auto 4px; }
  .pcard .pname { font-size: 18px; color: var(--gold); letter-spacing: 1px; margin-bottom: 4px; }
  .pcard .prole { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,233,160,.55); }

  #color-picker { display: flex; gap: 16px; margin-top: 8px; }
  .swatch { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform .15s, border-color .2s; box-shadow: inset 0 -3px 6px rgba(0,0,0,.3); }
  .swatch:hover { transform: scale(1.1); }
  .swatch.sel { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,.5), inset 0 -3px 6px rgba(0,0,0,.3); }
  .swatch.taken { opacity: .2; cursor: not-allowed; }
  .swatch.taken:hover { transform: none; }

  /* RIGHT: class + detail + start */
  .right { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 26px 28px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 24px; }
  #class-picker { display: flex; flex-direction: column; gap: 10px; }
  .class-opt {
    display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 9px; cursor: pointer; transition: all .18s;
    background: rgba(255,233,160,.05); border: 1px solid rgba(255,233,160,.16);
  }
  .class-opt:hover { background: rgba(255,233,160,.12); border-color: rgba(255,233,160,.4); }
  .class-opt.sel { background: rgba(255,233,160,.18); border-color: var(--gold); }
  .class-opt .ic { font-size: 27px; filter: grayscale(1); transition: filter .2s; }
  .class-opt:hover .ic, .class-opt.sel .ic { filter: grayscale(0); }
  .class-opt .nm { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-dim); }
  .class-opt.sel .nm { color: var(--gold); }

  #class-detail { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 12px; }
  #cd-title { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); }
  #cd-desc { font-size: 15px; line-height: 1.7; color: rgba(255,233,160,.7); min-height: 46px; }
  .cd-stat { display: flex; align-items: center; gap: 10px; }
  .cd-stat-name { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,233,160,.5); width: 30px; text-align: right; flex-shrink: 0; }
  .cd-stat-bar { flex: 1; height: 5px; background: rgba(255,233,160,.12); border-radius: 3px; overflow: hidden; }
  .cd-stat-fill { height: 100%; border-radius: 3px; display: block; }
  .cd-stat-fill.stat { background: linear-gradient(to right, var(--gold-dim), var(--gold)); }
  .cd-stat-fill.hp   { background: linear-gradient(to right, #d06b4a, #f08060); }
  .cd-stat-val { font-size: 13px; color: rgba(255,233,160,.7); width: 22px; text-align: right; flex-shrink: 0; }
  .cd-stat-val.hp { color: #f08060; }

  #start-area { margin-top: 4px; border-top: 1px solid var(--line); padding-top: 18px; }
  #footer { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,233,160,.5); text-align: center; line-height: 1.6; }
  #btn-start {
    display: none; width: 100%; padding: 16px; background: linear-gradient(180deg, rgba(255,233,160,.26), rgba(200,169,110,.14));
    border: 1px solid rgba(255,233,160,.6); border-radius: 8px; color: var(--gold);
    font-size: 16px; letter-spacing: 4px; text-transform: uppercase; cursor: pointer; font-family: 'Georgia', serif; transition: all .2s;
  }
  #btn-start:hover { background: rgba(255,233,160,.34); box-shadow: 0 0 18px rgba(255,233,160,.3); }

  @media (max-width: 880px) {
    .stage { grid-template-columns: 1fr; }
    .right { position: static; }
  }
</style>
</head>
<body>
  <header>
    <h1>Dungeons &amp; Dragons</h1>
    <span class="sub">Choose Your Hero</span>
    <span class="code" id="code">----</span>
  </header>

  <div class="stage">
    <!-- LEFT: party (everyone, me first) + color -->
    <section class="left">
      <div class="section-label">Party</div>
      <div id="roster"></div>
      <div class="section-label" style="margin-top:26px">Your Color</div>
      <div id="color-picker"></div>
    </section>

    <!-- RIGHT: class + detail + start -->
    <section class="right">
      <div>
        <div class="section-label">Choose Your Class</div>
        <div id="class-picker"></div>
      </div>
      <div id="class-detail">
        <div id="cd-title"></div>
        <div id="cd-desc"></div>
        <div id="cd-stats"></div>
      </div>
      <div id="start-area">
        <div id="footer">Waiting for the DM to start…</div>
        <button id="btn-start">▶ Start Adventure</button>
      </div>
    </section>
  </div>

<script type="module" src="../scripts/player-session.js"></script>
<script type="module">
import * as THREE from 'three';
import { send, on } from '../scripts/game-socket.js';
import { COLOR_KEYS, colorForKey, cssColorForKey } from '../scripts/colors.js';
import { createSlimeMiniature, updateSlimeAnimation } from '../scripts/miniature.js';

const myPid = localStorage.getItem('player-id');
const isSolo = localStorage.getItem('dndlite-solo') === '1';
document.getElementById('code').textContent = localStorage.getItem('session-code') || '----';

const CLASSES = [
  { role: 'warrior', icon: '🗡️', name: 'Warrior', desc: 'Brute force and iron will. Survives what others cannot.', stats: { str: 14, agi: 10, int: 8,  lck: 10, hp: 20 } },
  { role: 'rogue',   icon: '🏹', name: 'Rogue',   desc: 'Swift and silent. Strikes before you blink.',           stats: { str: 8,  agi: 14, int: 10, lck: 12, hp: 14 } },
  { role: 'mage',    icon: '🔮', name: 'Mage',    desc: 'Arcane knowledge and power. Bends reality itself.',     stats: { str: 6,  agi: 8,  int: 14, lck: 12, hp: 12 } },
  { role: 'cleric',  icon: '🪄', name: 'Cleric',  desc: "Divine grace mends wounds. Lyra's faithful apprentice.", stats: { str: 10, agi: 8,  int: 12, lck: 14, hp: 16 } },
];
const STAT_LABELS = [
  { key: 'str', label: 'STR' }, { key: 'agi', label: 'AGI' }, { key: 'int', label: 'INT' },
  { key: 'lck', label: 'LCK' }, { key: 'hp', label: 'HP' },
];
const STAT_MAX = 20;

// Defaults match what the server assigns the first/solo player (warrior + red),
// so the pickers show a selection immediately; lobby_state corrects it for
// later joiners a moment later.
let myRole = 'warrior', myColor = 'red', takenColors = new Set();

// ── Class picker + hover detail panel ──────────────────────────────
const classPicker = document.getElementById('class-picker');
for (const c of CLASSES) {
  const el = document.createElement('div');
  el.className = 'class-opt';
  el.dataset.role = c.role;
  el.innerHTML = `<span class="ic">${c.icon}</span><span class="nm">${c.name}</span>`;
  el.addEventListener('click', () => send({ type: 'char_update', role: c.role }));
  el.addEventListener('mouseenter', () => showClassDetail(c.role));
  el.addEventListener('mouseleave', () => showClassDetail(myRole));
  classPicker.appendChild(el);
}

const cdTitle = document.getElementById('cd-title');
const cdDesc  = document.getElementById('cd-desc');
const cdStats = document.getElementById('cd-stats');
function showClassDetail(role) {
  const c = CLASSES.find(x => x.role === role) || CLASSES[0];
  cdTitle.textContent = c.name;
  cdDesc.textContent = c.desc;
  cdStats.innerHTML = STAT_LABELS.map(s => {
    const isHp = s.key === 'hp';
    const pct = (c.stats[s.key] / STAT_MAX) * 100;
    return `<div class="cd-stat">
      <span class="cd-stat-name">${s.label}</span>
      <span class="cd-stat-bar"><span class="cd-stat-fill ${isHp ? 'hp' : 'stat'}" style="width:${pct}%"></span></span>
      <span class="cd-stat-val ${isHp ? 'hp' : ''}">${c.stats[s.key]}</span>
    </div>`;
  }).join('');
}

// ── Color picker ───────────────────────────────────────────────────
const colorPicker = document.getElementById('color-picker');
for (const key of COLOR_KEYS) {
  const el = document.createElement('div');
  el.className = 'swatch';
  el.dataset.key = key;
  el.style.background = cssColorForKey(key);
  el.addEventListener('click', () => {
    if (el.classList.contains('taken')) return;
    send({ type: 'char_update', color: key });
  });
  colorPicker.appendChild(el);
}

// ── Slime rendering: one shared offscreen renderer drawn into each card ──
const R_SIZE = 210;
// preserveDrawingBuffer keeps the GL back-buffer readable for the drawImage copy
// across all browsers (we render then copy into each card's 2D canvas same-frame).
const glRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
glRenderer.setPixelRatio(1);
glRenderer.setSize(R_SIZE, R_SIZE);
const gScene = new THREE.Scene();
gScene.add(new THREE.AmbientLight(0xffffff, 0.95));
const gDir = new THREE.DirectionalLight(0xffffff, 0.85);
gDir.position.set(3, 6, 5);
gScene.add(gDir);
const gCam = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
// Pulled back + smaller slime so the full body (and held emoji) fits with margin.
gCam.position.set(0, 1.9, 7.6);
gCam.lookAt(0, 1.15, 0);

// pid -> { group, role, color, canvas }
const slimes = new Map();
function ensureSlime(p) {
  let s = slimes.get(p.pid);
  if (!s || s.role !== p.role || s.color !== p.color) {
    const group = createSlimeMiniature(p.role, 2.3, colorForKey(p.color));
    s = { group, role: p.role, color: p.color, canvas: s ? s.canvas : null };
    slimes.set(p.pid, s);
  }
  return s;
}

function animate(t) {
  requestAnimationFrame(animate);
  for (const s of slimes.values()) {
    if (!s.canvas) continue;
    gScene.add(s.group);
    updateSlimeAnimation(s.group, t, 0);
    glRenderer.render(gScene, gCam);
    gScene.remove(s.group);
    const ctx = s.canvas.getContext('2d');
    ctx.clearRect(0, 0, s.canvas.width, s.canvas.height);
    ctx.drawImage(glRenderer.domElement, 0, 0, s.canvas.width, s.canvas.height);
  }
}
requestAnimationFrame(animate);

// ── Roster (slime cards; me first / top-left) ──────────────────────
function renderRoster(players) {
  const roster = document.getElementById('roster');
  roster.innerHTML = '';
  // me first, others keep their relative order (stable)
  const ordered = [...players].sort((a, b) => (b.pid === myPid ? 1 : 0) - (a.pid === myPid ? 1 : 0));
  const seen = new Set();
  for (const p of ordered) {
    seen.add(p.pid);
    const isMe = p.pid === myPid;
    const card = document.createElement('div');
    card.className = 'pcard' + (isMe ? ' me' : '');
    card.style.borderColor = cssColorForKey(p.color) || 'rgba(255,233,160,.16)';

    if (isMe) {
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = 'You';
      card.appendChild(badge);
    }

    const cv = document.createElement('canvas');
    cv.className = 'pslime';
    cv.width = 150; cv.height = 150;

    const nm = document.createElement('div');
    nm.className = 'pname';
    nm.textContent = p.name;

    const rl = document.createElement('div');
    rl.className = 'prole';
    rl.textContent = p.role;

    card.append(cv, nm, rl);
    roster.appendChild(card);

    const s = ensureSlime(p);
    s.canvas = cv; // bind the (possibly new) card canvas to this slime
  }
  // Drop slimes for players who left
  for (const pid of [...slimes.keys()]) {
    if (!seen.has(pid)) slimes.delete(pid);
  }
}

function syncPickers() {
  document.querySelectorAll('.class-opt').forEach(el => {
    el.classList.toggle('sel', el.dataset.role === myRole);
  });
  document.querySelectorAll('.swatch').forEach(el => {
    const key = el.dataset.key;
    const takenByOther = takenColors.has(key) && key !== myColor;
    el.classList.toggle('taken', takenByOther);
    el.classList.toggle('sel', key === myColor);
  });
}

on('lobby_state', (msg) => {
  const players = msg.players || [];
  const me = players.find(p => p.pid === myPid);
  if (me) {
    myRole = me.role; myColor = me.color;
    // Persist final pick so world-map/stages (and solo) render the right color.
    const char = JSON.parse(localStorage.getItem('dndlite-character') || '{}');
    char.role = me.role; char.color = me.color;
    localStorage.setItem('dndlite-character', JSON.stringify(char));
    showClassDetail(myRole); // keep the detail panel in sync when not hovering
  }
  takenColors = new Set(players.map(p => p.color).filter(Boolean));
  renderRoster(players);
  syncPickers();
});

// Initial state: warrior + red pre-selected (matches server default for the
// first/solo player) so the pickers aren't blank before the first lobby_state.
showClassDetail(myRole);
syncPickers();

// The `import 'three'` at the top can delay this module's execution past the
// server's initial rejoin `lobby_state` (player-session.js connects first with
// only fast local imports, so its player_rejoin — and the reply — can arrive
// before our handler is registered). Now that the handler IS registered,
// re-request the roster. An empty char_update changes nothing server-side and
// just triggers a fresh lobby_state broadcast, so the party/slimes appear
// without needing a manual interaction.
send({ type: 'char_update' });

// Solo: no DM to start — show a local Start button in the right column.
if (isSolo) {
  document.getElementById('footer').textContent = '';
  const btn = document.getElementById('btn-start');
  btn.style.display = 'block';
  btn.addEventListener('click', () => { window.location.href = 'cutscene.html'; });
}
// Multiplayer start is driven by the DM via player_redirect (handled in player-session.js).
</script>
</body>
</html>
