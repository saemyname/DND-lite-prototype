<style>

<body>

<canvas id="canvas"></canvas>
<div id="nav">
  <a href="../index.html">← Home</a>
  <a href="cutscene.html?replay=1">Replay intro</a>
</div>
<div id="tooltip"></div>

<!-- Party vote panel ─────────────────────────────────────────────────────── -->
<div id="vote-panel" style="position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:75;background:rgba(15,15,20,.92);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:20px 28px;font-family:system-ui,-apple-system,sans-serif;color:#eaeaf0;display:none;min-width:400px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5);">
  <div id="vote-message" style="font-size:19px;line-height:1.4;margin-bottom:12px;"></div>
  <div id="vote-buttons" style="display:flex;justify-content:center;gap:10px;margin-bottom:8px;">
    <button id="vote-yes" style="background:#2d7a3d;border:none;color:#fff;padding:10px 32px;font-family:inherit;font-size:16px;font-weight:600;border-radius:5px;cursor:pointer;">Yes</button>
    <button id="vote-no"  style="background:#8a2d2d;border:none;color:#fff;padding:10px 32px;font-family:inherit;font-size:16px;font-weight:600;border-radius:5px;cursor:pointer;">No</button>
  </div>
  <div id="vote-tally" style="font-size:15px;color:rgba(234,234,240,.55);"></div>
</div>

<script type="module">
// First-load gate: redirect to the intro cutscene unless the player has seen it.
// Uses `replace` so the back button doesn't ping-pong; ?replay=1 on the cutscene
// preserves the localStorage flag (replay link doesn't re-gate the user).
if (!localStorage.getItem('intro-seen')) {
  window.location.replace('cutscene.html');
}

import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { on, send } from '../scripts/game-socket.js';
import { createEmojiMiniature, createSlimeMiniature, updateSlimeAnimation } from '../scripts/miniature.js';
import { colorForKey } from '../scripts/colors.js';
import { initDebugBots } from '../scripts/debug-bots.js';
import { playBGM, playSFX } from '../scripts/audio.js';
playBGM('adventure'); // volume balanced centrally in audio.js (BGM_VOL_SCALE)

// ══════════════════════════════════════
//   RENDERER
// ══════════════════════════════════════

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2e2318); // dim wooden table
scene.fog = new THREE.FogExp2(0x2e2318, 0.0022);

// ══════════════════════════════════════
//   CAMERA
// ══════════════════════════════════════

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 12, 16);
const LOOK_TARGET  = new THREE.Vector3(0, 0, 0);
camera.lookAt(LOOK_TARGET);

// ── OrbitControls: drag-pan (left), drag-rotate (right), scroll-zoom ──
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(LOOK_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = false;     // pan along world XZ plane
controls.minDistance = 14;               // close-zoom: a few nodes
controls.maxDistance = 62;               // far-zoom: the whole parchment
controls.minPolarAngle = 0.05;           // near-top view
controls.maxPolarAngle = Math.PI / 2.2;  // near-side view (don't dip below horizon)
controls.minAzimuthAngle = 0;            // X-axis camera locked to center column
controls.maxAzimuthAngle = 0;
controls.mouseButtons = {
  LEFT:   THREE.MOUSE.PAN,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT:  THREE.MOUSE.ROTATE,
};
controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };

// Detect interaction so hover tooltip pauses while user drags the camera
let userInteracting = false;
controls.addEventListener('start', () => { userInteracting = true; });
controls.addEventListener('end',   () => { userInteracting = false; });

// ── Party vote panel ────────────────────────────────────────────────────
const STAGE_NAMES = {
  stage_01: 'Eldermoor Village',
  stage_02: "Goblin's Trail",
  stage_03: 'Whispering Forest',
  stage_04: 'Goblin Outpost',
  stage_05: 'Throne of the Goblin King',
  stage_06: 'The Vault',
  stage_07: 'Darkwood',
  stage_08: 'Sunken Ruins',
  stage_09: 'Shadow Keep',
  stage_10: 'Ash Plain',
  stage_11: 'Molten Path',
  stage_12: 'The Caldera',
};
const votePanel    = document.getElementById('vote-panel');
const voteMessage  = document.getElementById('vote-message');
const voteTally    = document.getElementById('vote-tally');
const voteButtons  = document.getElementById('vote-buttons');
const voteYesBtn   = document.getElementById('vote-yes');
const voteNoBtn    = document.getElementById('vote-no');
let voteActive = false;
let voteIsInitiator = false;

function openVotePanel({ initiatorName, stageId, isInitiator, yesCount, requiredYes }) {
  const stageName = STAGE_NAMES[stageId] || stageId;
  const who = isInitiator ? 'You' : initiatorName;
  voteMessage.innerHTML = `<b>${who}</b> wants to move to <b>${stageName}</b>`;
  voteButtons.style.display = isInitiator ? 'none' : 'flex';
  voteTally.textContent = `${yesCount} / ${requiredYes}`;
  votePanel.style.display = 'block';
  voteActive = true;
  voteIsInitiator = isInitiator;
}

function updateVoteTally(yesCount, requiredYes) {
  voteTally.textContent = `${yesCount} / ${requiredYes}`;
}

function closeVotePanel(briefMessage) {
  if (briefMessage) {
    voteMessage.textContent = briefMessage;
    voteButtons.style.display = 'none';
    voteTally.textContent = '';
    setTimeout(() => { votePanel.style.display = 'none'; }, 1200);
  } else {
    votePanel.style.display = 'none';
  }
  voteActive = false;
  voteIsInitiator = false;
}

voteYesBtn.addEventListener('click', () => {
  voteButtons.style.display = 'none';
  send({ type: 'vote_cast', vote: 'yes' });
});
voteNoBtn.addEventListener('click', () => {
  voteButtons.style.display = 'none';
  send({ type: 'vote_cast', vote: 'no' });
});

on('vote_state', (msg) => {
  const isInitiator = msg.initiatorPid === myPid;
  if (!voteActive) {
    // First receipt — snapshot every party miniature's current target so we
    // can snap them back if the vote is cancelled.
    for (const entry of partyMiniatures.values()) {
      if (entry.targetPos) entry._preVoteTargetPos = entry.targetPos.clone();
    }
    openVotePanel({
      initiatorName: msg.initiatorName,
      stageId: msg.stageId,
      isInitiator,
      yesCount: msg.yesCount,
      requiredYes: msg.requiredYes,
    });
  } else {
    updateVoteTally(msg.yesCount, msg.requiredYes);
  }
  // Each yes voter's slime "leans" halfway toward the proposed stage as a
  // visual cue. The existing tick() lerp does the smooth walk.
  const stage = stages[msg.stageId];
  if (stage) {
    const yesSet = new Set(msg.yesPids || []);
    for (const [pid, entry] of partyMiniatures) {
      if (!entry._preVoteTargetPos) continue;
      if (yesSet.has(pid)) {
        const lean = entry._preVoteTargetPos.clone().lerp(stage.worldPos, 0.55);
        entry.targetPos = lean;
      }
    }
  }
});

on('vote_resolved', (msg) => {
  if (msg.passed) {
    closeVotePanel();
    // world_map_state broadcast that follows will set final targets per slot
    for (const entry of partyMiniatures.values()) delete entry._preVoteTargetPos;
  } else {
    closeVotePanel('Cancelled');
    // Snap every miniature back to where it stood before the vote
    for (const entry of partyMiniatures.values()) {
      if (entry._preVoteTargetPos) {
        entry.targetPos = entry._preVoteTargetPos;
        delete entry._preVoteTargetPos;
      }
    }
    localMoveIntent = null;
  }
});


// ══════════════════════════════════════
//   LIGHTING
// ══════════════════════════════════════

scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(20, 50, 15);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -40;
keyLight.shadow.camera.right = 40;
keyLight.shadow.camera.top = 40;
keyLight.shadow.camera.bottom = -40;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 120;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x88aaff, 0.8);
fillLight.position.set(-15, 20, -10);
scene.add(fillLight);

// ══════════════════════════════════════
//   PAPER MAP — hand-drawn parchment plane
//   (node layout + drawn texture share MAP_NODES, so they always align)
// ══════════════════════════════════════

let mapModel = null;   // kept for compatibility with old references
let mapScale = 1;
const mapOffset = new THREE.Vector3();
const clickables = [];

// ── Stage system ──
const stages = {};       // { 'stage_01': { object, worldPos } }
let currentStage = null;
let miniature = null;
let miniTargetPos = null; // lerp target for movement
let miniMoving = false;
let miniArrivalCallback = null;
let miniBottomOffset = 0;
const MINI_SPEED = 0.04;  // lerp factor
const clearedStages = new Set(['stage_01']); // start cleared

// Character data
const charData = JSON.parse(localStorage.getItem('dndlite-character') || 'null');
const charRole = charData?.role?.toLowerCase() || 'warrior';

// Multiplayer party state (other players + self when in a session)
const myPid = localStorage.getItem('player-id');
initDebugBots({ myPid, getServerState: () => null });
const partyMiniatures = new Map(); // pid → { group, stageId, targetPos }
const inSession = !!localStorage.getItem('session-code');
let localMoveIntent = null;  // stageId destined for redirect on lerp arrival
let lastPartyState = null;   // cached so we can re-render before setup finishes
let myLastKnownStage;        // undefined = haven't received any state yet

// ── Layout: an S-path from the village (south) to the caldera (north) ──
const MAP_NODES = [
  { key: 'stage_01', x:  -8, z:  26 },
  { key: 'stage_02', x:   6, z:  21 },
  { key: 'stage_03', x: -10, z:  16 },
  { key: 'stage_04', x:   4, z:  11 },
  { key: 'stage_05', x:  -6, z:   6 },
  { key: 'stage_06', x:   8, z:   1 },
  { key: 'stage_07', x:  -8, z:  -4 },
  { key: 'stage_08', x:   3, z:  -9 },
  { key: 'stage_09', x:  -9, z: -14 },
  { key: 'stage_10', x:   9, z: -19 },
  { key: 'stage_11', x:   0, z: -24 },
  { key: 'stage_12', x:  -4, z: -30 },
];
const MAP_W = 68;                       // plane width  (x ∈ [-34, 34])
const MAP_NORTH = -40, MAP_SOUTH = 34;  // plane z extents
const MAP_H = MAP_SOUTH - MAP_NORTH;
const CANVAS_W = 1024;
const CANVAS_H = Math.round(CANVAS_W * MAP_H / MAP_W);

const mapCanvas = document.createElement('canvas');
mapCanvas.width = CANVAS_W;
mapCanvas.height = CANVAS_H;
const mapCtx = mapCanvas.getContext('2d');
const worldToCanvas = (x, z) => [
  (x + MAP_W / 2) / MAP_W * CANVAS_W,
  (z - MAP_NORTH) / MAP_H * CANVAS_H,
];

// Deterministic PRNG so decorative doodles don't shift on redraws.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let z = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}

const CHAPTER_OF = key => { const n = Number(key.replace(/\D/g, '')); return n <= 6 ? 1 : n <= 9 ? 2 : 3; };
const WAX_COLOR = { 1: 0xa63a2a, 2: 0x5f4a8a, 3: 0xb85c22 };

function drawMapTexture() {
  const ctx = mapCtx;
  const rnd = mulberry32(1042);
  const INK = '#4a3421';
  const inkA = a => `rgba(74, 52, 33, ${a})`;
  const WAX = '#a63a2a';

  // ── vellum: golden base, fiber streaks, mottling, water stains, folds ──
  ctx.fillStyle = '#dcc389';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  for (let i = 0; i < 260; i++) {
    const x = rnd() * CANVAS_W;
    ctx.strokeStyle = `rgba(${170 + rnd() * 40 | 0}, ${140 + rnd() * 30 | 0}, 80, ${0.04 + rnd() * 0.05})`;
    ctx.lineWidth = 1 + rnd() * 2;
    ctx.beginPath();
    const y0 = rnd() * CANVAS_H;
    ctx.moveTo(x, y0);
    ctx.lineTo(x + (rnd() - 0.5) * 8, y0 + 40 + rnd() * 160);
    ctx.stroke();
  }
  for (let i = 0; i < 70; i++) {
    const x = rnd() * CANVAS_W, y = rnd() * CANVAS_H, r = 30 + rnd() * 90;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(160, 122, 60, ${0.02 + rnd() * 0.05})`);
    g.addColorStop(1, 'rgba(160, 122, 60, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  for (let i = 0; i < 4; i++) {
    const x = rnd() * CANVAS_W, y = rnd() * CANVAS_H, r = 40 + rnd() * 60;
    ctx.strokeStyle = `rgba(140, 100, 45, ${0.10 + rnd() * 0.06})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, r, rnd() * 6, rnd() * 3 + 3.5); ctx.stroke();
  }
  const crease = (x1, y1, x2, y2) => {
    ctx.strokeStyle = 'rgba(120, 88, 40, 0.16)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 240, 200, 0.22)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x1 + 2, y1 + 2); ctx.lineTo(x2 + 2, y2 + 2); ctx.stroke();
  };
  crease(0, CANVAS_H * 0.335, CANVAS_W, CANVAS_H * 0.345);
  crease(0, CANVAS_H * 0.67, CANVAS_W, CANVAS_H * 0.66);
  crease(CANVAS_W * 0.485, 0, CANVAS_W * 0.5, CANVAS_H);
  for (let e = 0; e < 5; e++) {
    ctx.strokeStyle = `rgba(70, 45, 18, ${0.05 + e * 0.05})`;
    ctx.lineWidth = 24 - e * 4;
    ctx.strokeRect(ctx.lineWidth / 2 + e * 5, ctx.lineWidth / 2 + e * 5,
      CANVAS_W - ctx.lineWidth - e * 10, CANVAS_H - ctx.lineWidth - e * 10);
  }

  // ── double-ruled frame with latitude tick band ──
  const M = 34;
  ctx.strokeStyle = INK; ctx.lineWidth = 5;
  ctx.strokeRect(M, M, CANVAS_W - 2 * M, CANVAS_H - 2 * M);
  ctx.lineWidth = 1.5;
  ctx.strokeRect(M + 14, M + 14, CANVAS_W - 2 * (M + 14), CANVAS_H - 2 * (M + 14));
  ctx.fillStyle = INK;
  const seg = 44;
  for (let x = M; x < CANVAS_W - M - seg; x += seg * 2) {
    ctx.fillRect(x, M + 3, seg, 8);
    ctx.fillRect(x + seg, CANVAS_H - M - 11, seg, 8);
  }
  for (let y = M; y < CANVAS_H - M - seg; y += seg * 2) {
    ctx.fillRect(M + 3, y + seg, 8, seg);
    ctx.fillRect(CANVAS_W - M - 11, y, 8, seg);
  }
  for (const [cx, cy] of [[M + 14, M + 14], [CANVAS_W - M - 14, M + 14], [M + 14, CANVAS_H - M - 14], [CANVAS_W - M - 14, CANVAS_H - M - 14]]) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - 10); ctx.lineTo(cx + 10, cy); ctx.lineTo(cx, cy + 10); ctx.lineTo(cx - 10, cy);
    ctx.closePath(); ctx.fill();
  }

  // ── region ghost capitals ──
  const ghost = (text, z, size, angle) => {
    const [, py] = worldToCanvas(0, z);
    ctx.save();
    ctx.translate(CANVAS_W / 2, py);
    ctx.rotate(angle);
    ctx.font = `${size}px Georgia, serif`;
    ctx.fillStyle = inkA(0.13);
    ctx.textAlign = 'center';
    ctx.fillText(text, 0, 0);
    ctx.restore();
  };
  ghost('E L D E R M O O R', 15, 64, -0.02);
  ghost("T H E   S H A D O W ' S   L A N D", -9, 50, 0.015);
  ghost('T H E   B U R N I N G   P E A K', -26.5, 50, -0.015);

  // ── hachure mountain ranges on the chapter borders ──
  const peak = (x, y, s) => {
    ctx.strokeStyle = inkA(0.75); ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(x - s, y); ctx.lineTo(x, y - s * 1.15); ctx.lineTo(x + s, y);
    ctx.stroke();
    ctx.strokeStyle = inkA(0.35); ctx.lineWidth = 1.4;
    for (let k = 1; k <= 3; k++) {
      const u = k / 4;
      ctx.beginPath();
      ctx.moveTo(x + u * s * 0.5, y - (1 - u) * s * 1.05);
      ctx.lineTo(x + u * s * 1.0, y - (1 - u) * s * 0.35);
      ctx.stroke();
    }
  };
  const range = (z, wobble) => {
    for (let x = -24; x <= 24; x += 3.4 + rnd() * 1.6) {
      if (MAP_NODES.some(n => Math.hypot(n.x - x, n.z - z) < 4.2)) continue;
      const [px, py] = worldToCanvas(x, z + (rnd() - 0.5) * wobble);
      peak(px, py, 16 + rnd() * 12);
    }
  };
  range(3.6, 1.6);   // Eldermoor / Shadow's Land divide (the north range made way for the volcano)

  // ── the trail ──
  const pts = MAP_NODES.map(n => worldToCanvas(n.x, n.z));
  ctx.strokeStyle = inkA(0.8);
  ctx.lineWidth = 4.5;
  ctx.setLineDash([15, 11]);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    const [px, py] = pts[i - 1], [cx, cy] = pts[i];
    ctx.quadraticCurveTo(px + (cx - px) * 0.5 + (rnd() - 0.5) * 40, py + (cy - py) * 0.5, cx, cy);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // ── flora ──
  const tree = (x, y, s) => {
    ctx.strokeStyle = inkA(0.6); ctx.lineWidth = 1.6;
    ctx.fillStyle = 'rgba(95, 122, 79, 0.5)';
    ctx.beginPath(); ctx.arc(x, y, s, 0.9 * Math.PI, 2.6 * Math.PI); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y + s); ctx.lineTo(x, y + s * 1.8); ctx.stroke();
    ctx.strokeStyle = inkA(0.3);
    ctx.beginPath(); ctx.arc(x + s * 0.25, y + s * 0.15, s * 0.55, 0.2, 1.3); ctx.stroke();
  };
  for (let i = 0; i < 22; i++) {
    const z = 6 + rnd() * 24, x = (rnd() - 0.5) * 52;
    if (MAP_NODES.some(n => Math.hypot(n.x - x, n.z - z) < 5.5)) continue;
    const [px, py] = worldToCanvas(x, z);
    tree(px, py, 12 + rnd() * 8);
    if (rnd() > 0.5) tree(px + 20 + rnd() * 10, py + 6, 9 + rnd() * 6);
  }
  for (let i = 0; i < 12; i++) {
    const z = -14.5 + rnd() * 9, x = (rnd() - 0.5) * 52;
    if (MAP_NODES.some(n => Math.hypot(n.x - x, n.z - z) < 5.5)) continue;
    const [px, py] = worldToCanvas(x, z);
    ctx.strokeStyle = 'rgba(60, 45, 80, 0.55)'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(px, py + 14); ctx.lineTo(px, py);
    ctx.moveTo(px, py + 4); ctx.lineTo(px - 8, py - 6);
    ctx.moveTo(px, py + 1); ctx.lineTo(px + 7, py - 9);
    ctx.moveTo(px, py + 8); ctx.lineTo(px + 6, py + 2);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(166, 58, 42, 0.35)';
  for (let i = 0; i < 40; i++) {
    const z = -32 + rnd() * 13, x = (rnd() - 0.5) * 54;
    if (MAP_NODES.some(n => Math.hypot(n.x - x, n.z - z) < 5)) continue;
    const [px, py] = worldToCanvas(x, z);
    ctx.beginPath(); ctx.arc(px, py, 1.5 + rnd() * 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // ── the volcano ──
  { const [vx, vy] = worldToCanvas(20, -16.5);
    ctx.strokeStyle = inkA(0.85); ctx.lineWidth = 3;
    ctx.fillStyle = 'rgba(140, 90, 55, 0.25)';
    ctx.beginPath();
    ctx.moveTo(vx - 90, vy + 34); ctx.lineTo(vx - 16, vy - 78); ctx.lineTo(vx + 10, vy - 78); ctx.lineTo(vx + 88, vy + 34);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = inkA(0.4); ctx.lineWidth = 1.6;
    for (let k = 0; k < 7; k++) {
      const u = k / 7;
      ctx.beginPath();
      ctx.moveTo(vx + 12 + u * 66, vy + 30 - u * 2);
      ctx.lineTo(vx + 4 + u * 52, vy - 66 * (1 - u) + 22 * u);
      ctx.stroke();
    }
    ctx.strokeStyle = WAX; ctx.lineWidth = 3.4;
    for (const dx of [-24, 2, 30]) {
      ctx.beginPath(); ctx.moveTo(vx - 3, vy - 74);
      ctx.quadraticCurveTo(vx + dx * 0.5, vy - 24, vx + dx, vy + 30);
      ctx.stroke();
    }
    ctx.strokeStyle = inkA(0.5); ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(vx + 6, vy - 96, 12, 0.4, 4.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(vx + 22, vy - 116, 8, 2.2, 6.6); ctx.stroke();
  }

  // ── marginalia ──
  ctx.font = 'italic 22px Georgia, serif';
  ctx.fillStyle = inkA(0.5);
  ctx.textAlign = 'center';
  ctx.fillText('here be goblins', CANVAS_W * 0.79, CANVAS_H * 0.86);

  // ── compass rose ──
  { const cx = CANVAS_W - 128, cy = CANVAS_H - 148, R = 44;
    ctx.strokeStyle = inkA(0.8); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.62, 0, Math.PI * 2); ctx.stroke();
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4 - Math.PI / 2;
      const big = k % 2 === 0;
      const len = big ? R : R * 0.6;
      const w = big ? 8 : 5;
      const tipX = cx + Math.cos(a) * len, tipY = cy + Math.sin(a) * len;
      const lx = cx + Math.cos(a + Math.PI / 2) * w, ly = cy + Math.sin(a + Math.PI / 2) * w;
      const rx = cx + Math.cos(a - Math.PI / 2) * w, ry = cy + Math.sin(a - Math.PI / 2) * w;
      ctx.fillStyle = k === 0 ? WAX : (big ? INK : inkA(0.45));
      ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(lx, ly); ctx.lineTo(rx, ry); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = INK;
    ctx.font = 'bold 24px Georgia, serif';
    ctx.fillText('N', cx, cy - R - 12); }

  // ── cartouche title ──
  { const cw = 560, chh = 96, cx = CANVAS_W / 2, cy = 96;
    ctx.fillStyle = 'rgba(228, 203, 138, 0.9)';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    const x0 = cx - cw / 2, y0 = cy - chh / 2;
    ctx.beginPath();
    ctx.moveTo(x0 + 18, y0); ctx.lineTo(x0 + cw - 18, y0); ctx.lineTo(x0 + cw, y0 + 18);
    ctx.lineTo(x0 + cw, y0 + chh - 18); ctx.lineTo(x0 + cw - 18, y0 + chh); ctx.lineTo(x0 + 18, y0 + chh);
    ctx.lineTo(x0, y0 + chh - 18); ctx.lineTo(x0, y0 + 18); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1.4;
    ctx.strokeRect(x0 + 10, y0 + 10, cw - 20, chh - 20);
    ctx.strokeStyle = inkA(0.7); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x0 - 16, cy, 14, 1.1, 5.4); ctx.stroke();
    ctx.beginPath(); ctx.arc(x0 + cw + 16, cy, 14, 4.0, 8.4); ctx.stroke();
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.font = '600 34px Georgia, serif';
    ctx.fillText('THE LANDS OF ELDERMOOR', cx, cy + 2);
    ctx.font = 'italic 16px Georgia, serif';
    ctx.fillStyle = inkA(0.6);
    ctx.fillText('being a true chart of the campaign, as surveyed by the slime expedition', cx, cy + 28); }

  // ── stage marks ──
  for (const n of MAP_NODES) {
    const [px, py] = worldToCanvas(n.x, n.z);
    const num = n.key.replace(/\D/g, '');
    const unlocked = (typeof isStageUnlocked === 'function') ? isStageUnlocked(n.key) : n.key === 'stage_01';
    if (unlocked) {
      ctx.beginPath(); ctx.arc(px, py, 19, 0, Math.PI * 2);
      ctx.fillStyle = WAX; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); ctx.arc(px, py, 24, 0, Math.PI * 2);
      ctx.lineWidth = 1.3; ctx.stroke();
      ctx.fillStyle = '#efdcb0';
    } else {
      ctx.beginPath(); ctx.arc(px, py, 19, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(74, 52, 33, 0.06)'; ctx.fill();
      ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.strokeStyle = inkA(0.5); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = inkA(0.55);
    }
    ctx.font = 'bold 21px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText(num, px, py + 8);
    ctx.font = 'italic 19px Georgia, serif';
    const label = STAGE_NAMES[n.key] || '';
    if (unlocked) {
      ctx.fillStyle = 'rgba(255, 240, 205, 0.55)';
      ctx.fillText(label, px + 1, py + 47);
      ctx.fillStyle = inkA(0.9);
    } else {
      ctx.fillStyle = inkA(0.35);
    }
    ctx.fillText(label, px, py + 46);
  }

  mapTexture.needsUpdate = true;
}

// Deferred setup — mirrors the old async GLB-load timing so later-declared
// consts (stageClickables, serverUnlocked) exist before we touch them.
setTimeout(() => {
  for (const key of Object.keys(stages)) {
    stages[key].object.traverse(c => {

  currentStage = stages['stage_01'];

  refreshStageLockVisuals();
  controls.target.set(0, 0, stages['stage_01'].worldPos.z);
  camera.position.set(0, 30, stages['stage_01'].worldPos.z + 24); // start with a readable overview
  controls.update();
  if (!inSession) loadMiniature();
  if (lastPartyState) syncPartyMiniatures(lastPartyState);
}, 0);

// ── Miniature (emoji sprite) ──
function loadMiniature() {
  miniature = createSlimeMiniature(charRole, 1.5, colorForKey(charData?.color));
  miniBottomOffset = 0; // group origin is at the bottom (sprite centered at y=height/2)
  if (currentStage) {
    const p = currentStage.worldPos;
    miniature.position.set(p.x, p.y, p.z);
  }

// ── Stage clickable meshes (direct hit on model geometry) ──
const stageClickables = [];

// ── Stage key → page URL ──
function getStageURL(stageKey) {
  const num = stageKey.replace(/\D/g, '');
  return `stage${num.padStart(2, '0')}.html`;
}

// ── Move miniature to a stage ──
function moveToStage(stageKey) {
  const stage = stages[stageKey];
  if (!stage) return;

  // In multiplayer: propose a party vote. Server skips the vote for solo+bots
  // (only one human) and executes the move directly.
  if (inSession) {
    if (voteActive) return; // already a vote in flight
    localMoveIntent = stageKey;
    send({ type: 'vote_start', stageId: stageKey });
  }

  if (!miniature) return; // multiplayer: own miniature is in partyMiniatures, no local lerp needed here

  miniTargetPos = stage.worldPos.clone();
  miniTargetPos.y -= miniBottomOffset;
  miniMoving = true;
  currentStage = stage;
  miniArrivalCallback = () => {
    window.location.href = getStageURL(stageKey);
  };

  // Clear fog at destination
  revealFog(stage.worldPos.x, stage.worldPos.z);

  // Mark as cleared
  clearedStages.add(stageKey);
  console.log('Moving to:', stageKey);
}

// ══════════════════════════════════════
//   FOG OF WAR (particle cloud)
// ══════════════════════════════════════

const FOG_COUNT = 800;
const FOG_SPREAD = 35;  // XZ spread radius
const FOG_Y_MIN = 1;
const FOG_Y_MAX = 3;
const FOG_PARTICLE_SIZE = 12;
const FOG_REVEAL_RADIUS = 6; // world units

// Soft circle sprite texture
const spriteCanvas = document.createElement('canvas');
spriteCanvas.width = 64;
spriteCanvas.height = 64;
const sCtx = spriteCanvas.getContext('2d');
const grad = sCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
grad.addColorStop(0, 'rgba(255,255,255,0.6)');
grad.addColorStop(0.4, 'rgba(255,255,255,0.3)');
grad.addColorStop(1, 'rgba(255,255,255,0)');
sCtx.fillStyle = grad;
sCtx.fillRect(0, 0, 64, 64);
const spriteTexture = new THREE.CanvasTexture(spriteCanvas);

// Particle positions + base opacity
const fogPositions = new Float32Array(FOG_COUNT * 3);
const fogOpacities = new Float32Array(FOG_COUNT); // per-particle opacity
const fogBasePositions = []; // store original positions for reveal check

for (let i = 0; i < FOG_COUNT; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 4 + Math.random() * FOG_SPREAD;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  const y = FOG_Y_MIN + Math.random() * (FOG_Y_MAX - FOG_Y_MIN);
  fogPositions[i * 3]     = x;
  fogPositions[i * 3 + 1] = y;
  fogPositions[i * 3 + 2] = z;
  fogOpacities[i] = 1.0;
  fogBasePositions.push({ x, z });
}

// Per-particle animation state: 'idle' | 'dispersing' | 'gone'
const fogState = [];
for (let i = 0; i < FOG_COUNT; i++) {
  fogState.push({ state: 'idle', vx: 0, vz: 0, progress: 0 });
}

const fogGeo = new THREE.BufferGeometry();
fogGeo.setAttribute('position', new THREE.BufferAttribute(fogPositions, 3));

const fogMat = new THREE.PointsMaterial({
  map: spriteTexture,
  size: FOG_PARTICLE_SIZE,
  transparent: true,
  opacity: 0.5,
  depthWrite: false,
  blending: THREE.NormalBlending,
  sizeAttenuation: true,
  color: 0xdddddd,
});

const fogPoints = new THREE.Points(fogGeo, fogMat);
fogPoints.renderOrder = 900;
scene.add(fogPoints);

function revealFog(worldX, worldZ, fromBroadcast = false) {
  for (let i = 0; i < FOG_COUNT; i++) {
    if (fogState[i].state !== 'idle') continue;
    const bp = fogBasePositions[i];
    const dx = bp.x - worldX;
    const dz = bp.z - worldZ;
    const dist2 = dx * dx + dz * dz;
    if (dist2 < FOG_REVEAL_RADIUS * FOG_REVEAL_RADIUS) {
      const dist = Math.sqrt(dist2) || 0.1;
      const speed = 4 + Math.random() * 5;
      fogState[i].state = 'dispersing';
      fogState[i].vx = (dx / dist) * speed;
      fogState[i].vz = (dz / dist) * speed;
      fogState[i].progress = 0;
    }
  }
  if (inSession && !fromBroadcast) {
    send({ type: 'fog_reveal', x: worldX, z: worldZ });
  }
}

// ══════════════════════════════════════
//   MULTIPLAYER SYNC
// ══════════════════════════════════════

const serverUnlocked = new Set(
  JSON.parse(localStorage.getItem('unlocked-stages') || '["stage_01"]')
);

function syncUnlockedStages(list) {
  serverUnlocked.clear();
  for (const key of list) serverUnlocked.add(key);
  localStorage.setItem('unlocked-stages', JSON.stringify(list));
  revealFogForUnlockedStages();
  refreshStageLockVisuals();
}

// Fog is derived from progress: every unlocked stage has the mist around its
// node cleared. Pure function of serverUnlocked, computed on each client
// (fromBroadcast=true → no server echo needed). Safe to call before the map
// GLB finishes loading: `stages` is empty then and the GLB-load path re-runs it.
function revealFogForUnlockedStages() {
  for (const key of serverUnlocked) {
    const s = stages[key];
    if (s) revealFog(s.worldPos.x, s.worldPos.z, true);
  }
}

if (localStorage.getItem('session-code')) {
  on('joined', (msg) => {
    if (msg.unlockedStages) syncUnlockedStages(msg.unlockedStages);
  });

  on('player_rejoined', (msg) => {
    if (msg.unlockedStages) syncUnlockedStages(msg.unlockedStages);
  });

  on('stage_unlock', (msg) => {
    const _wasLocked = !serverUnlocked.has(msg.stageKey);
    serverUnlocked.add(msg.stageKey);
    localStorage.setItem('unlocked-stages', JSON.stringify([...serverUnlocked]));
    console.log('[ws] Stage unlocked:', msg.stageKey);
    refreshStageLockVisuals();
    const s = stages[msg.stageKey];
    if (s) revealFog(s.worldPos.x, s.worldPos.z, true); // mist around the new stage lifts
    if (_wasLocked) playSFX('unlock');
  });

  on('fog_reveal', (msg) => {
    revealFog(msg.x, msg.z, true);
  });

  on('fog_history', (msg) => {
    for (const p of (msg.points || [])) revealFog(p.x, p.z, true);
  });

  on('world_map_state', (msg) => {
    lastPartyState = msg.players || [];
    syncPartyMiniatures(lastPartyState);
  });
}

function syncPartyMiniatures(players) {
  console.log('[syncPartyMiniatures] players:', players.length, 'stages available:', Object.keys(stages));
  // Detect party movement targeting me — trigger redirect on arrival
  const myP = players.find(p => p.pid === myPid);
  if (myP) {
    if (myLastKnownStage === undefined) {
      myLastKnownStage = myP.stageId;
    } else if (myLastKnownStage !== myP.stageId) {
      myLastKnownStage = myP.stageId;
      if (myP.stageId) localMoveIntent = myP.stageId;
    }
  }
  const seen = new Set();
  for (const p of players) {
    seen.add(p.pid);
    let entry = partyMiniatures.get(p.pid);
    const isNew = !entry;
    if (isNew) {
      const group = createSlimeMiniature(p.role, 1, colorForKey(p.color));
      scene.add(group);
      entry = { group, stageId: null, targetPos: null };
      partyMiniatures.set(p.pid, entry);
      console.log(`[party] created miniature for ${p.name} (${p.role}) pid=${p.pid}`);
    }
    // Horizontal line arrangement, slot 0 = leader on the left
    const sortedPids = [...players].map(pp => pp.pid).sort();
    const slotIdx = sortedPids.indexOf(p.pid);
    const slotCount = sortedPids.length;
    const SLOT_SPACING = slotCount >= 5 ? 1.5 : 1.8;
    const offsetX = (slotIdx - (slotCount - 1) / 2) * SLOT_SPACING;
    const offsetZ = 0;

    const slotChanged = entry._slotIdx !== slotIdx || entry._slotCount !== slotCount;
    const stageChanged = p.stageId !== entry.stageId;
    const needsPlacement = isNew || stageChanged || !entry.targetPos || slotChanged;
    if (needsPlacement) {
      entry.stageId = p.stageId;
      entry._slotIdx = slotIdx;
      entry._slotCount = slotCount;
      let stage = stages[p.stageId];
      if (!stage) stage = stages['stage_01'] || stages['stage1'] || stages['stage01'];
      if (!stage) {
        const firstKey = Object.keys(stages)[0];
        if (firstKey) stage = stages[firstKey];
      }
      if (stage) {
        const newPos = stage.worldPos.clone();
        newPos.x += offsetX;
        newPos.z += offsetZ;
        if (isNew || !entry.targetPos) {
          entry.group.position.copy(newPos);
          console.log(`[party] placed ${p.name} at`, newPos.x.toFixed(1), newPos.y.toFixed(1), newPos.z.toFixed(1));
        } else if (stageChanged) {
          // Conga line! Leader (slot 0) moves first, each follower delayed by 200ms
          entry._moveStartTime = performance.now() + slotIdx * 200;
        }
        entry.targetPos = newPos;
      } else if (isNew) {
        entry.group.position.set(0, 5, 0);
        console.warn(`[party] stages not loaded — placeholder at (0,5,0) for ${p.name}, will retry`);
      }
    }
  }
  // Remove disconnected
  for (const [pid, entry] of [...partyMiniatures.entries()]) {
    if (!seen.has(pid)) {
      scene.remove(entry.group);
      partyMiniatures.delete(pid);
    }
  }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltipEl = document.getElementById('tooltip');

let hoveredStageKey = null;

function isStageUnlocked(stageId) {
  // stage_01 is always open; everything else requires a server-broadcast unlock
  // (auto-fired on the previous stage's victory, or DM-triggered in DM mode).
  return stageId === 'stage_01' || serverUnlocked.has(stageId);
}

function refreshStageLockVisuals() {
  // Redraw the parchment (locked nodes are faded/hollow there) and tint the
  // 3D markers: locked = washed-out gray, unlocked = chapter wax color.
  drawMapTexture();
  for (const [key, s] of Object.entries(stages)) {
    const unlocked = isStageUnlocked(key);
    s.object.traverse(c => {
      if (!c.isMesh || c.userData._baseColor == null) return;
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(m => {
        m.color.setHex(unlocked ? c.userData._baseColor : 0x8a8178);
        m.transparent = true;
        m.opacity = unlocked ? 1 : 0.5;
      });
    });
  }
}

function setStageHover(stageKey, hover) {
  const stage = stages[stageKey];
  if (!stage) return;
  const unlocked = isStageUnlocked(stageKey);

  stage.object.traverse(c => {
    if (!c.isMesh) return;
    if (!c.userData._matCloned) {
      c.material = Array.isArray(c.material)
        ? c.material.map(m => m.clone())
        : c.material.clone();
      c.userData._matCloned = true;
    }
    const mats = Array.isArray(c.material) ? c.material : [c.material];
    mats.forEach(m => {
      if (!m.emissive) return;
      if (hover) {
        if (unlocked) {
          m.emissive.setRGB(1, 0, 0);
          m.emissiveIntensity = 1;
        } else {
          m.emissive.setRGB(0.25, 0.25, 0.25);
          m.emissiveIntensity = 0.5;
        }
      } else {
        m.emissive.setRGB(0, 0, 0);
        m.emissiveIntensity = 0;
      }
    });
  });

  stage.object.scale.setScalar(hover ? 1.5 : 1.0);
}

const STAGE_HIT_PX = 55; // screen-space pixel radius for hover/click
const _stageProj = new THREE.Vector3();

function nearestStageKey(clientX, clientY) {
  let bestKey = null, bestDist = STAGE_HIT_PX;
  for (const [key, stage] of Object.entries(stages)) {
    _stageProj.copy(stage.worldPos).project(camera);
    const sx = ( _stageProj.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (1 - (_stageProj.y * 0.5 + 0.5)) * window.innerHeight;
    const d = Math.hypot(sx - clientX, sy - clientY);
    if (d < bestDist) { bestDist = d; bestKey = key; }
  }
  return bestKey;
}

canvas.addEventListener('pointermove', e => {
  if (userInteracting) {
    // Suppress hover updates while the user is dragging the camera around
    if (hoveredStageKey) setStageHover(hoveredStageKey, false);
    hoveredStageKey = null;
    tooltipEl.classList.remove('visible');
    canvas.style.cursor = 'grabbing';
    return;
  }
  const stageKey = nearestStageKey(e.clientX, e.clientY);

  if (stageKey !== hoveredStageKey) {
    if (hoveredStageKey) setStageHover(hoveredStageKey, false);
    hoveredStageKey = stageKey;
    if (hoveredStageKey) setStageHover(hoveredStageKey, true);
  }

  if (stageKey) {
    const unlocked = isStageUnlocked(stageKey);
    const name = STAGE_NAMES[stageKey] || stageKey;
    tooltipEl.textContent = unlocked ? name : `🔒 ${name} — Locked`;
    tooltipEl.style.left = (e.clientX + 16) + 'px';
    tooltipEl.style.top = (e.clientY - 10) + 'px';
    tooltipEl.classList.add('visible');
    canvas.style.cursor = unlocked ? 'pointer' : 'not-allowed';
  } else {
    tooltipEl.classList.remove('visible');
    canvas.style.cursor = 'default';
  }
});

// Ground plane for raycasting (catches clicks on fog areas)
const groundPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0, transparent: true })
);
groundPlane.rotation.x = -Math.PI / 2;
groundPlane.position.y = 0;
scene.add(groundPlane);

// Track pointer-down to distinguish a click from a camera drag
let _downX = 0, _downY = 0;
canvas.addEventListener('pointerdown', e => { _downX = e.clientX; _downY = e.clientY; });

canvas.addEventListener('click', e => {
  if (Math.hypot(e.clientX - _downX, e.clientY - _downY) > 5) return; // was a drag
  const stageId = nearestStageKey(e.clientX, e.clientY);
  if (stageId && !miniMoving) {
    if (isStageUnlocked(stageId)) {
      moveToStage(stageId);
    } else {
      console.log('Stage locked:', stageId, '— clear previous first');
    }
  }
  // Fog now clears automatically around unlocked stages (see revealFogForUnlockedStages),
  // so click-to-reveal on the ground was removed.
});

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

// ══════════════════════════════════════
//   RENDER LOOP
// ══════════════════════════════════════

const clock = new THREE.Clock();
let lastTime = 0;

function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  const dt = t - lastTime;
  lastTime = t;

  // Fog particle animation — idle drift throttled to every 3rd frame to cut CPU/GPU load.
  // Dispersing particles still update every frame so reveal feels snappy.
  const fogPos = fogGeo.attributes.position;
  const idleThisFrame = (Math.floor(t * 20) % 3) === 0;
  let anyChange = false;
  for (let i = 0; i < FOG_COUNT; i++) {
    const s = fogState[i];
    if (s.state === 'gone') continue;
    if (s.state === 'dispersing') {
      s.progress += dt * 1.5;
      fogPos.setX(i, fogPos.getX(i) + s.vx * dt);
      fogPos.setZ(i, fogPos.getZ(i) + s.vz * dt);
      if (s.progress >= 1) {
        s.state = 'gone';
        fogPos.setY(i, -999);
      }
      anyChange = true;
    } else if (idleThisFrame) {
      const bp = fogBasePositions[i];
      fogPos.setX(i, bp.x + Math.sin(t * 0.3 + i * 0.7) * 1.5);
      fogPos.setZ(i, bp.z + Math.cos(t * 0.25 + i * 0.5) * 1.5);
      anyChange = true;
    }
  }
  if (anyChange) fogPos.needsUpdate = true;

  const nowMs = performance.now();
  const HOP_LEN = 1.4;
  const HOP_MS = 320;

  // Step a slime one hop toward its target. Returns true when arrived this frame.
  function stepHop(group, targetPos, floorY) {
    const ud = group.userData;
    if (!targetPos) { updateSlimeAnimation(group, nowMs, floorY); return false; }
    const dx = targetPos.x - group.position.x;
    const dz = targetPos.z - group.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    // Start a new hop if idle and not yet at target
    if (ud.jumpStart == null && dist > 0.05) {
      const step = Math.min(HOP_LEN, dist);
      const nx = group.position.x + (dx / dist) * step;
      const nz = group.position.z + (dz / dist) * step;
      ud.jumpFrom = new THREE.Vector3(group.position.x, floorY, group.position.z);
      ud.jumpTo   = new THREE.Vector3(nx, floorY, nz);
      ud.jumpStart = nowMs;
      ud.jumpDuration = HOP_MS;
      ud.targetPos = targetPos;
      playSFX('jump'); // one hop sound per tile-hop (stepHop chains hops per journey)
    }
    updateSlimeAnimation(group, nowMs, floorY);
    // Snap + arrival check after the animation step
    const ndx = targetPos.x - group.position.x;
    const ndz = targetPos.z - group.position.z;
    if (ud.jumpStart == null && Math.sqrt(ndx * ndx + ndz * ndz) < 0.05) {
      group.position.x = targetPos.x;
      group.position.z = targetPos.z;
      return true;
    }
    return false;
  }

  // Solo miniature
  if (miniature) {
    const target = (miniMoving && miniTargetPos) ? miniTargetPos : null;
    const floorY = target ? target.y : miniature.position.y;
    const arrived = stepHop(miniature, target, floorY);
    if (arrived && miniMoving) {
      miniMoving = false;
      if (miniArrivalCallback) {
        const cb = miniArrivalCallback;
        miniArrivalCallback = null;
        cb();
      }
    }
  }

  // Party miniatures
  for (const [pid, entry] of partyMiniatures) {
    if (entry._moveStartTime && nowMs < entry._moveStartTime) continue; // conga delay
    const floorY = entry.targetPos ? entry.targetPos.y : entry.group.position.y;
    const arrived = stepHop(entry.group, entry.targetPos || null, floorY);
    if (arrived && pid === myPid && entry.stageId && entry.stageId === localMoveIntent) {
      const url = entry.stageId.replace(/^stage_/, 'stage') + '.html';
      localMoveIntent = null;
      if (serverUnlocked.has(entry.stageId) || entry.stageId === 'stage_01') {
        setTimeout(() => { window.location.href = url; }, 200);
      }
    }
  }

  // Fog density tied to camera distance (closer = clearer)
  const camDist = camera.position.distanceTo(controls.target);
  const distRatio = Math.min(1, Math.max(0, (camDist - 6) / 44));
  scene.fog.density = 0.001 + distRatio * 0.008;

  controls.update();
  // Hard-lock X to center
  if (controls.target.x !== 0) {
    const dx = controls.target.x;
    controls.target.x = 0;
    camera.position.x -= dx;
  }
  // Clamp Z within the map's north-south span (stage_05 ≈ -10, stage_01 ≈ 7)
  const Z_MIN = -32, Z_MAX = 28;
  if (controls.target.z < Z_MIN) {
    const dz = controls.target.z - Z_MIN;
    controls.target.z = Z_MIN;
    camera.position.z -= dz;
  } else if (controls.target.z > Z_MAX) {
    const dz = controls.target.z - Z_MAX;
    controls.target.z = Z_MAX;
    camera.position.z -= dz;
  }
  renderer.render(scene, camera);
}
tick();
</script>
<script type="module" src="../scripts/chat-panel.js"></script>
<script type="module" src="../scripts/player-session.js"></script>
